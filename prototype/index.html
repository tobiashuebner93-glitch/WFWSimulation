<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f1">
  <title>Werkstatt – Maschinenbau-Simulation</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Werkstatt Startseite"><span class="brand-mark">W</span><span>werkstatt<span class="brand-sub">MASCHINENBAU SIMULATION</span></span></a>
      <div class="date-pill"><span class="pulse"></span><span id="today">01. Jan. 2027</span><span class="separator">·</span><span id="weekday">Freitag</span></div>
      <div class="save-actions"><button class="btn btn-secondary btn-small" id="saveButton" type="button">Speichern</button><button class="btn btn-secondary btn-small" id="loadButton" type="button">Laden</button><input id="loadFile" type="file" accept="application/json,.json" hidden></div>
      <button class="icon-button" id="resetButton" type="button" aria-label="Spielstand zurücksetzen" title="Spielstand zurücksetzen">↻</button>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button type="button" data-view="dashboard" class="nav-item active"><span>⌂</span>Übersicht</button>
      <button type="button" data-view="orders" class="nav-item"><span>▤</span>Aufträge</button>
      <button type="button" data-view="planning" class="nav-item"><span>◷</span>Planung</button><button type="button" data-view="finance" class="nav-item"><span>€</span>Finanzen</button>
      <button type="button" data-view="network" class="nav-item"><span>⇄</span>Netzwerk</button>
      <button type="button" data-view="training" class="nav-item"><span>✦</span>Lernen</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
