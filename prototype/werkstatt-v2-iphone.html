n und Lieferantenkommunikation prüfen.',['Just-in-time ohne Absicherung einsetzen.','Alle Lagerbestände dieses Bauteils sofort verbrauchen.','Den Lieferanten erst bei einem Stillstand kontaktieren.'],'Bei kritischer Einzelquelle muss die Versorgung strategisch abgesichert werden.','Produktionsstillstände durch Lieferausfall werden weniger wahrscheinlich.'],\r\n ['bestellmenge','Ein Betrieb bestellt sehr große Lose, um Mengenrabatte zu erhalten, und hat dadurch hohe Lagerkosten. Was ist sinnvoll?','Einkaufsvorteil gegen Kapitalbindung, Lagerkosten und Obsoleszenzrisiko abwägen.',['Jeden Rabatt unabhängig von Gesamtkosten annehmen.','Lagerkosten aus der Wirtschaftlichkeitsrechnung auslassen.','Bestellmengen ausschließlich nach Palettengröße bestimmen.'],'Ein niedriger Einstandspreis kann durch zusätzliche Bestandskosten überkompensiert werden.','Die Bestellmenge orientiert sich stärker an den Gesamtkosten und dem tatsächlichen Bedarf.'],\r\n ['meldebestand','Der durchschnittliche Verbrauch eines Werkstoffs steigt wegen neuer Aufträge, die Wiederbeschaffungszeit bleibt gleich. Welche Bestandsgröße ist zu überprüfen?','Meldebestand und Sicherheitsbestand an den veränderten Verbrauch anpassen.',['Den Meldebestand unverändert lassen, weil Lieferzeit gleich blieb.','Den Höchstbestand auf null setzen.','Nur die Inventurhäufigkeit reduzieren.'],'Der erwartete Verbrauch während der Lieferzeit ist höher und kann eine frühere Bestellung erfordern.','Fehlmengen werden seltener, während die Bestandssteuerung an den aktuellen Auftragseingang angepasst wird.'],\r\n ['sicherheitsbestand','Die Lieferzeit eines Standardlagers schwankt stärker als bisher. Welches Ziel erfüllt ein angemessener Sicherheitsbestand?','Ungewissheit in Verbrauch oder Wiederbeschaffung teilweise abfedern.',['Alle denkbaren Lieferausfälle dauerhaft vollständig ausschließen.','Den gesamten Jahresbedarf als Reserve lagern.','Den Lieferanten von seiner Terminverantwortung entbinden.'],'Ein Sicherheitsbestand puffert Risiken, verursacht aber selbst Kapital- und Lagerkosten.','Die Geschäftsführung kann das gewünschte Servicelevel gegen Bestandskosten abwägen.'],\r\n ['lagerhaltung','Ein Lager enthält mehrere Jahre alte Normteile, die kaum noch verwendet werden. Welche Datengrundlage ist vor einer Ausbuchung nötig, damit offene Bedarfe und Verwertungsmöglichkeiten nicht übersehen werden?','Umschlag, Bedarf, Verwendbarkeit und mögliche Verwertung der Altbestände prüfen.',['Altbestand pauschal als aktuellen Bedarf behandeln.','Den Lagerbestand abschreiben lassen und erst danach prüfen, ob einzelne Normteile für offene Aufträge noch verwendbar sind.','Die Bestandsdaten löschen, um die Lagerquote zu verbessern.'],'Langsamdreher können gebundenes Kapital und Veralterungsrisiko anzeigen; ihre Behandlung braucht Bedarfsklärung.','Bestände werden realistischer geplant und unnötige Nachkäufe können vermieden werden.'],\r\n ['lagerorganisation','Mitarbeitende suchen regelmäßig lange nach Werkzeugen, obwohl diese laut System vorhanden sind. Welche Maßnahme ist passend?','Lagerplätze eindeutig kennzeichnen und Entnahme- sowie Rückbuchungsprozess vereinheitlichen.',['Mehr Werkzeuge bestellen, ohne den Verbleib zu klären.','Werkzeuge ohne Lagerplatzkennzeichnung verteilen.','Bestände nur einmal jährlich auswerten.'],'Transparente Lagerorte und Bewegungen verbessern Auffindbarkeit und Bestandsgenauigkeit.','Suchzeiten und unnötige Ersatzbeschaffungen sinken.'],\r\n ['wareneingang','Eine Lieferung enthält mehr Teile als im Lieferschein angegeben. Wie sollte der Wareneingang vorgehen?','Menge dokumentieren, Abweichung klären und Bestand erst nach geprüftem Beleg freigeben.',['Die Übermenge ohne Nachweis einlagern.','Den Lieferschein eigenmächtig ändern und Rechnung akzeptieren.','Die gesamte Lieferung ablehnen, ohne Vertrag oder Bedarf zu prüfen.'],'Abweichungen müssen nachvollziehbar geklärt werden, bevor Bestand und Zahlungsvorgang fortgeführt werden.','Buchbestand und Lieferantenabrechnung bleiben verlässlich und prüfbar.'],\r\n ['qualitaetspruefung','Der Prüfplan verlangt bei jedem möglichen Materialfehler die Sperrung der betroffenen Charge und eine Freigabeentscheidung der Qualitätsverantwortlichen. Bei einer Stichprobe fällt ein Teil auf. Was ist zu tun?','Betroffene Charge separieren, Befund dokumentieren und Freigabe nach Prüfregel klären.',['Die gesamte Charge ohne Bewertung direkt in die Produktion geben.','Den Fehler nur mündlich weitergeben und Ware freigeben.','Die übrige Charge anhand einer selbst gewählten Zusatzstichprobe freigeben, ohne den im Prüfplan festgelegten Annahmeumfang zu beachten.'],'Eine kontrollierte Sperrung verhindert, dass ungeklärtes Material unbemerkt weiterverarbeitet wird.','Fehlerkosten und Sicherheitsrisiken können begrenzt werden, während die Lieferantenklärung läuft.'],\r\n ['materialfluss','Werkstoffe werden mehrfach zwischen Lager und Fertigung umgelagert, bevor sie bearbeitet werden. Wie kann der Materialfluss verbessert werden?','Weg, Übergaben und Bereitstellungspunkte aufnehmen und unnötige Transporte reduzieren.',['Eine weitere Zwischenlagerfläche einrichten, ohne Prozessanalyse.','Alle Werkstoffe unabhängig von Reihenfolge direkt an Maschinen stellen.','Transportzeiten aus der Prozessbetrachtung streichen.'],'Eine Flussanalyse identifiziert unnötige Bewegungen und mögliche Bereitstellungsänderungen.','Durchlaufzeiten und Handhabungsaufwand können sinken, ohne Materialverfügbarkeit zu gefährden.'],\r\n ['produktionslogistik','Ein Auftrag beginnt an der CNC, obwohl ein erforderliches Werkzeug noch nicht bereitgestellt wurde. Welche Planungsschnittstelle fehlt?','Arbeitsvorbereitung, Werkzeugbereitstellung und Fertigungsfreigabe müssen zeitlich abgestimmt werden.',['Die Maschine früher starten, um Wartezeit auszugleichen.','Das Werkzeug erst nach Beginn des Auftrags suchen.','Werkzeugverfügbarkeit im Auftrag nicht erfassen.'],'Fertigungsstart setzt voraus, dass notwendige Ressourcen bereitstehen.','Maschinenstillstand durch vermeidbare Such- und Wartezeiten nimmt ab.'],\r\n ['kommissionierung','Ein Versandmitarbeiter packt versehentlich Teile aus zwei Kundenaufträgen zusammen. Welche Prozesskontrolle ist hilfreich?','Kommissionierung auftragsbezogen kennzeichnen und vor Verpackungsabschluss abgleichen.',['Alle fertigen Teile gemeinsam ohne Auftragstrennung lagern.','Den Versandbeleg erst nach Auslieferung erstellen.','Kundenkennzeichnung durch allgemeine Teilecodes ersetzen.'],'Auftragsbezogene Kennzeichnung und Kontrolle verhindern Verwechslungen.','Falschlieferungen und daraus entstehende Rücktransport- und Nacharbeitskosten sinken.'],\r\n ['lieferplanung','Ein Kunde benötigt eine Teillieferung früher als den Rest des Auftrags. Was sollte die Logistik vor Zusage prüfen?','Verfügbarkeit, zusätzliche Transportkosten, Folgen für Restlieferung und Kundenbedarf abstimmen.',['Die Teillieferung als kostenlos und folgenlos behandeln.','Den Gesamtauftrag ohne Kundeninformation aufteilen.','Nur den frühesten möglichen Termin betrachten.'],'Teillieferung verändert Materialfluss und Kosten und muss mit Bedarf und Auftrag abgestimmt werden.','Der Betrieb kann Kundenservice bieten, ohne Restauftrag und Logistikaufwand zu übersehen.'],\r\n ['inventur','Bei einer physischen Zählung liegt der gezählte Bestand über dem negativen Systembestand; Wareneingänge und Entnahmen sind noch nicht vollständig gebucht. Welche Prüfung muss vor einer Bestandskorrektur erfolgen, solange Materialbewegungen noch ungebucht sind?','Bewegungsbelege und Buchungszeitpunkte prüfen, Ursache klären und Korrektur dokumentieren.',['Den gezählten Bestand sofort als verfügbaren Bestand buchen und offene Bewegungen nach der Inventurkorrektur nachtragen.','Die Bestandsdifferenz als Ausschuss buchen und die nicht abgeglichenen Materialbelege bei der nächsten Monatsinventur prüfen.','Die Zählung wiederholen und bis dahin den Systembestand als Dispositionsgrundlage weiterverwenden.'],'Negative Bestände deuten häufig auf fehlende oder verspätete Bewegungsbuchungen hin.','Bestandsdaten und Materialverbrauch werden nachvollziehbarer und künftige Disposition verbessert.'],\r\n ['lagerkennzahlen','Der Lagerumschlag eines Artikels ist hoch, doch es gab mehrere Produktionsunterbrechungen wegen Fehlteilen. Welche Kennzahl sollte ergänzt werden?','Servicegrad oder Fehlmengenhäufigkeit betrachten.',['Nur die Lagerumschlagshäufigkeit weiter erhöhen.','Fehlmengen aus der Kennzahl ausblenden.','Den Lagerwert als Maß für Termintreue verwenden.'],'Hoher Umschlag ist nicht automatisch gut, wenn die Versorgung der Produktion leidet.','Bestandsziele können Kapitalbindung und Lieferfähigkeit balancieren.'],\r\n ['wertschoepfungskette','Eine Kundenänderung erreicht die Konstruktion, aber nicht Einkauf und Fertigung. Welche Logistikperspektive hilft?','Informations- und Materialübergaben entlang der gesamten Wertschöpfungskette betrachten.',['Jede Abteilung nur nach ihrer lokalen Bearbeitungszeit optimieren.','Kundenänderungen ausschließlich im Vertrieb dokumentieren.','Die Lieferkette auf den physischen Transport begrenzen.'],'Wertschöpfung erfordert abgestimmte Informationsflüsse zwischen den Beteiligten.','Änderungen können früher in Materialbestellung und Produktion berücksichtigt werden.'],\r\n ['lieferantenbeziehung','Ein Lieferant kündigt für ein auftragskritisches Bauteil eine Verzögerung an. Die Betriebsleitung erwägt Mehrarbeit, hat aber Kapazität und Zusatzkosten noch nicht ermittelt. Was muss vor einer verbindlichen Mehrarbeits- oder Terminzusage vorliegen?','Verfügbare Kapazität und benötigte Mehrarbeitsstunden je betroffenem Auftrag prüfen, Zusatzkosten und Terminwirkung vergleichen und erst danach einen machbaren Kundentermin verbindlich abstimmen.',['Die Information ignorieren, solange Fälligkeit noch nicht überschritten ist.','Sofort alle Bestellungen ohne Prüfung stornieren.','Dem Kunden weiterhin den alten Termin garantieren.'],'Vor einer verbindlichen Zusage müssen Kapazität, Mehrarbeitskosten und Auswirkungen auf betroffene Liefertermine geprüft werden; erst dann lässt sich mit dem Kunden ein belastbarer Termin vereinbaren.','Die Betriebsleitung kann eine machbare und wirtschaftliche Reaktion wählen und Kunden auf Basis eines belastbaren Termins informieren.'],\r\n ['beschaffungsrecht','Eine Bestellung enthält abweichende Lieferbedingungen in Auftragsbestätigung und Angebot. Was sollte der Einkauf vor weiterer Abwicklung tun?','Dokumente vergleichen, Abweichung klären und vereinbarte Bedingungen nachvollziehbar bestätigen.',['Die jeweils günstigere Klausel stillschweigend auswählen.','Die Abweichung ignorieren und Ware bestellen.','Rechtliche Wirkung ohne Prüfung als eindeutig annehmen.'],'Abweichende Vertragsdokumente können unterschiedliche Rechte und Pflichten abbilden; Klärung ist erforderlich.','Der Betrieb reduziert Streit über Lieferzeit, Preis oder Gefahrübergang.'],\r\n ['rationalisierung','Ein Lagerbereich wird häufig überfüllt, während ein anderer kaum genutzt wird. Welche Rationalisierungsmaßnahme ist sinnvoll?','Artikelprofile und Bewegungsmuster erfassen und Lagerplätze bedarfsgerecht neu zuordnen.',['Alle Regale entfernen und Ware direkt im Gang abstellen.','Lagerfläche unabhängig von Nutzung weiter anmieten.','Die Bestandsmenge als einzige Ursache festlegen.'],'Platz- und Bewegungsdaten zeigen, ob Layout oder Bestandsstruktur verbessert werden kann.','Such- und Transportwege können kürzer werden und Flächen besser genutzt werden.'],\r\n ['rationalisierung','Mitarbeitende erfassen Wareneingänge doppelt in zwei Systemen. Welche Verbesserung sollte vor einer Automatisierung geprüft werden?','Datenquelle und Prozessverantwortung vereinheitlichen und doppelte Erfassung beseitigen.',['Doppelte Eingabe automatisiert parallel fortführen.','Ein System ohne Datenabgleich abschalten.','Mehr Pflichtfelder hinzufügen, ohne den Zweck zu klären.'],'Automatisierung eines unnötigen Doppelschritts festigt lediglich die Verschwendung.','Bearbeitungsaufwand und Übertragungsfehler können verringert werden.'],\r\n ['transportplanung','Ein Spediteur bündelt Sendungen; dadurch wird ein dringender Auftrag einen Tag später zugestellt. Was ist bei der Tourenplanung abzuwägen?','Transportauslastung mit zugesagten Lieferterminen und Dringlichkeit der Sendungen abstimmen.',['Maximale Bündelung unabhängig von Kundenvereinbarungen priorisieren.','Jede Sendung einzeln fahren lassen, ohne Kostenwirkung zu prüfen.','Transportzeit aus der Lieferplanung entfernen.'],'Auslastungsvorteile müssen gegen Service- und Terminfolgen bewertet werden.','Die Versandplanung kann Kosten senken, ohne kritische Lieferzusagen zu verletzen.'],\r\n ['verpackung','Teile kommen beim Kunden wegen unzureichender Verpackung beschädigt an. Welche Logistikmaßnahme adressiert das Problem?','Verpackungsanforderungen, Schutz und Handhabung für Transportweg und Produkt prüfen.',['Den Spediteur verantwortlich machen, ohne Schadensursache zu untersuchen.','Mehr Verpackungsmaterial unabhängig von Produkt und Transportweg nutzen.','Beschädigungen nur beim Kunden erfassen.'],'Verpackung muss zum Produkt und zu den tatsächlichen Transportbelastungen passen.','Transportschäden und Reklamationen können sinken, während Materialverbrauch gezielt bleibt.'],\r\n ['retourenlogistik','Ein Kunde sendet ein falsches Bauteil zurück, das möglicherweise wiederverwendbar ist. Wie sollte es behandelt werden?','Retoure identifizieren, Zustand prüfen und nach dokumentierter Freigabe Bestand oder Sperrbestand zuordnen.',['Rücksendung sofort als verfügbaren Neuzugang buchen.','Ware ohne Befund entsorgen.','Die Retoure dem Lagerbestand eines anderen Artikels zuschlagen.'],'Eine kontrollierte Rückführung verhindert fehlerhafte Bestände und erhält die Möglichkeit der Verwertung.','Der Betrieb kann Rücksendekosten und nutzbare Materialien transparent behandeln.'],\r\n ['lagerlayout','Schwere Werkstücke werden in hohen Regalen über häufig genutzten leichten Teilen gelagert. Welche Layoutprüfung ist nötig?','Gewicht, Zugriffshäufigkeit, Transportmittel und sichere Greifhöhen berücksichtigen.',['Lagerplätze ausschließlich alphabetisch anordnen.','Schwere Teile unabhängig von Handhabung oben belassen.','Zugriffshäufigkeit bei der Lagerplanung ignorieren.'],'Lagerlayout muss Bewegungs- und Sicherheitsanforderungen berücksichtigen.','Umlagerungen und Handhabungsrisiken sinken; häufig benötigte Teile sind besser erreichbar.'],\r\n ['bedarfsvorschau','Ein Großkunde kündigt einen einmaligen Sonderbedarf an, der den üblichen Verbrauch stark übersteigt. Wie sollte die Disposition reagieren?','Sonderbedarf getrennt kennzeichnen und nicht ungeprüft in den permanenten Verbrauchstrend übernehmen.',['Den Spitzenbedarf als neuen monatlichen Normalverbrauch fortschreiben.','Sonderbedarf vollständig ignorieren.','Dauerhafte Bestellparameter auf Basis des Einzelereignisses erhöhen.'],'Einmalige Nachfrage muss von wiederkehrendem Bedarf unterschieden werden.','Nachbestellungen bleiben nach dem Sonderauftrag angemessen und Überbestände werden vermieden.']\r\n]});\r\nareas[2].items.push(\r\n ['bestandsplanung','Ein Rohmaterial hat ein kurzes Verfalls- oder Alterungsrisiko und wird selten verbraucht. Wie sollte der Betrieb seine Bestellpolitik gestalten?','Bedarf, Mindestlosgröße und Haltbarkeit abstimmen und Überbestände vermeiden.',['Den größten Mengenrabatt unabhängig von Haltbarkeit wählen.','Die Ware nach Eingang ohne Verbrauchsplanung lagern.','Das Alterungsrisiko nur bei der Inventur erfassen.'],'Die Bestellmenge muss neben Preis auch Nutzbarkeit innerhalb der Haltbarkeit berücksichtigen.','Abschreibungen und Ausschuss durch unbrauchbar gewordene Materialien werden unwahrscheinlicher.'],\r\n ['lieferantenbewertung','Ein Lieferant erfüllt Preis- und Qualitätserwartung, meldet aber Änderungen häufig verspätet. Welche Bewertung ist sinnvoll?','Kommunikation und Änderungsmanagement als Teil der Lieferantenleistung bewerten.',['Die Zusammenarbeit nur nach Stückpreis einstufen.','Informationsverhalten als nicht-logistisch behandeln.','Den Lieferanten ohne Rückmeldung sofort sperren.'],'Frühzeitige Information ist für Disposition und Kundenliefertermine relevant.','Risiken aus späten Änderungsmeldungen können in Lieferantenentwicklung oder Alternativen einfließen.'],\r\n ['beschaffungsrisiko','Ein Werkstoff stammt aus einer Region mit zunehmenden Transportstörungen. Was ist eine angemessene Vorsorge?','Abhängigkeit, Wiederbeschaffungszeit und alternative Bezugswege bewerten.',['Den Bestand ohne Risikoprüfung maximal erhöhen.','Den Kunden eine Liefergarantie ohne Absicherung geben.','Das Risiko erst nach einer ausgebliebenen Lieferung dokumentieren.'],'Die Vorsorge sollte proportional zum Risiko sein und mögliche Alternativen einbeziehen.','Der Betrieb kann Versorgungssicherheit und Kapitalbindung bewusst austarieren.'],\r\n ['disposition','Das ERP schlägt eine Bestellung vor, obwohl ausreichend Bestand vorhanden ist; mehrere Entnahmen wurden noch nicht gebucht. Was ist zuerst zu prüfen?','Buchungsrückstand und tatsächliche Verfügbarkeit mit Lager und Fertigung abgleichen.',['Vorschlag automatisch freigeben.','Den Systembestand ohne Zählung überschreiben.','Die vorgeschlagene Menge bestellen und Buchungsfehler ignorieren.'],'Disposition ist nur so gut wie die zugrundeliegenden Bestandsdaten.','Fehlbestellungen werden vermieden und der Lagerprozess kann gezielt korrigiert werden.'],\r\n ['lagerzonierung','Kleinteile und große Werkstücke werden im selben Bereich gelagert, was die Kommissionierung verlangsamt. Was sollte bei einer Neuordnung berücksichtigt werden?','Abmessungen, Umschlag, Zugriffshäufigkeit und geeignete Lagertechnik gruppieren.',['Alle Artikel nach alphabetischer Reihenfolge über dieselben Regale verteilen.','Umschlagshäufigkeit bei der Platzwahl ausblenden.','Nur die Entfernung zum Wareneingang als Kriterium verwenden.'],'Eine auf Artikelprofil und Zugriff abgestimmte Zonierung reduziert Handhabungsaufwand.','Kommissionierung und Flächennutzung werden effizienter, ohne Sicherheitsanforderungen zu vernachlässigen.'],\r\n ['materialbereitstellung','Die Fertigung ruft Material häufig kurzfristig aus dem Zentrallager ab, obwohl der Tagesplan bekannt ist. Welche Lösung könnte den Fluss verbessern?','Material anhand freigegebener Aufträge rechtzeitig und mengenrichtig an definierte Bereitstellplätze liefern.',['Alle Aufträge ohne Reihenfolge gleichzeitig an Maschinen stellen.','Material erst nach Maschinenstillstand aus dem Lager holen.','Die Bereitstellung aus dem Produktionsplan entfernen.'],'Vorausgeplante Bereitstellung nutzt verfügbare Informationen und verringert Ad-hoc-Unterbrechungen.','Maschinenbedienende verbringen weniger Zeit mit Materialsuche.'],\r\n ['produktionssteuerung','Ein dringender Auftrag wird in die Fertigungsreihenfolge eingeschoben und verdrängt mehrere zugesagte Termine. Was muss die Produktionslogistik vor der Umpriorisierung tun?','Auswirkungen auf Kapazität, Materialverfügbarkeit und betroffene Liefertermine transparent machen.',['Nur die Dringlichkeit des neuen Auftrags betrachten.','Alle anderen Kundenaufträge ohne Information verschieben.','Den Auftrag zusätzlich einplanen, ohne Kapazitätsprüfung.'],'Priorisierung hat Folgen für bestehende Aufträge und muss mit Ressourcen und Kundenverpflichtungen abgestimmt werden.','Terminänderungen und Engpasswirkungen werden sichtbar, bevor die Werkstatt umplant.'],\r\n ['kommissionierung','Die Versandkontrolle findet regelmäßig fehlende Kleinteile in ansonsten vollständigen Aufträgen. Welche Maßnahme verbessert die Fehlererkennung?','Auftragsbezogene Packliste mit Scan- oder Mengenabgleich vor Versand einsetzen.',['Nur die äußere Verpackung auf Beschädigungen prüfen.','Alle Kleinteile lose und ohne Zählung beilegen.','Den Packvorgang nach dem Versand dokumentieren.'],'Ein systematischer Mengenabgleich erkennt fehlende Positionen vor der Auslieferung.','Nachsendungen und Kundenbeschwerden können reduziert werden.'],\r\n ['lieferperformance','Die Liefertermintreue ist hoch, aber viele Aufträge werden mit teuren Sonderfahrten pünktlich. Was sagt die Kennzahl allein nicht?','Sie zeigt nicht die Kosten und Prozessaufwände, die zur Terminerfüllung erforderlich waren.',['Sie beweist, dass die Logistikkosten minimal sind.','Sie enthält automatisch den Bestandumschlag.','Sie zeigt die Lieferqualität nach Kundeneinsatz.'],'Eine einzelne Servicekennzahl bildet den Ressourceneinsatz nicht ab.','Das Management kann Termintreue mit Kosten- und Planungsstabilität gemeinsam optimieren.'],\r\n ['inventur','Ein hochwertiges Werkzeug ist laut System an einem Lagerplatz, dort aber nicht auffindbar. Welche Reaktion ist angemessen?','Letzte Bewegungen und Zugriffe prüfen, Suche dokumentieren und Bestand nach Verfahren klären.',['Den Artikel direkt als gestohlen melden, ohne Belege zu prüfen.','Einen neuen Artikel bestellen und alten Bestand unverändert führen.','Den Bestand durch einen anderen Werkzeugtyp ersetzen.'],'Nachvollziehbare Ursachenklärung unterscheidet Buchungsfehler, Umlagerung und tatsächlichen Verlust.','Bestandsgenauigkeit verbessert sich und unnötige Ersatzkosten werden vermieden.'],\r\n ['lieferantenrecht','Eine angelieferte Charge weicht von der vereinbarten Spezifikation ab. Was sollte der Betrieb für eine belastbare weitere Behandlung tun?','Abweichung und Charge dokumentieren, Ware prüfen und vereinbarte Reklamations- beziehungsweise Prüfabläufe beachten.',['Material trotz Abweichung ohne Prüfung verarbeiten.','Ware kommentarlos entsorgen und Rechnung ignorieren.','Rechtsfolgen pauschal annehmen, ohne Vertrag und Sachverhalt zu prüfen.'],'Dokumentation und vertraglich abgestimmtes Vorgehen sichern eine sachgerechte Qualitäts- und Anspruchsklärung.','Der Betrieb begrenzt Produktionsrisiken und kann mit dem Lieferanten auf Faktenbasis klären.'],\r\n ['rationalisierung','Ein hoher Anteil der Lagerbewegungen besteht aus mehrfacher Umlagerung desselben Materials. Welcher Schritt ist zuerst sinnvoll?','Bewegungsdaten und Layout analysieren, um vermeidbare Umlagerungsursachen zu finden.',['Eine weitere Umlagerungsschicht einführen.','Alle Umlagerungen pauschal als produktiv bewerten.','Den Bestand reduzieren, ohne Materialfluss zu prüfen.'],'Die Ursache kann in Layout, Bereitstellung oder Platzplanung liegen und sollte vor einer Maßnahme ermittelt werden.','Interne Transportkosten und Beschädigungsrisiken können gezielt reduziert werden.'],\r\n ['logistikkennzahlen','Das Lager bindet weniger Kapital, doch Produktionsstillstände durch Fehlteile nehmen zu. Wie sollte das Zielsystem angepasst werden?','Bestandswert mit Fehlmengen, Servicegrad und Stillstandsfolgen gemeinsam steuern.',['Den Lagerwert weiter minimieren, unabhängig von Produktionswirkung.','Fehlteile als Fertigungsproblem aus der Logistikbewertung entfernen.','Sicherheitsbestände für alle Teile identisch festlegen.'],'Kapitalbindung und Versorgungssicherheit stehen in einem Zielkonflikt.','Die Disposition kann differenzierte Bestandsziele für kritische und unkritische Materialien setzen.'],\r\n ['wertschoepfungskette','Ein Kunde ändert eine Zeichnung, nachdem der Betrieb das Material bereits bestellt hat. Welche Koordination ist erforderlich?','Änderungsinformation, vorhandene Beschaffung und Fertigungsfolgen gemeinsam bewerten.',['Die Änderung nur an die Konstruktion weiterleiten.','Alte Bestellung und neue Zeichnung unabhängig weiterführen.','Material erst nach Fertigstellung des Auftrags prüfen.'],'Änderungen wirken entlang der Kette auf Material, Kosten und Ablauf.','Ausschuss und vermeidbare Kosten können vor der Weiterverarbeitung begrenzt werden.'],\r\n ['lagerkosten','Ein Unternehmen mietet kurzfristig zusätzlichen Lagerraum für langsam drehende Bestände. Welche Frage sollte es zuerst beantworten?','Ob Bestandsursache, Abbauoption und Gesamtkosten die zusätzliche Fläche rechtfertigen.',['Zusätzliche Lagerfläche als kostenneutral betrachten.','Mietkosten allein dem Umsatz zurechnen.','Alle langsam drehenden Teile ohne Verwendungsprüfung entsorgen.'],'Flächenkosten lösen die Bestandsursache nicht; Nutzen und Alternativen gehören in den Vergleich.','Das Unternehmen kann unnötige laufende Kosten vermeiden und Kapitalbindung reduzieren.'],\r\n ['transportkosten','Ein Kunde wünscht eine Expresslieferung, deren Mehrkosten den Auftragsbeitrag stark reduzieren. Was ist vor Zusage zu klären?','Mehrkosten, Zahlungsbereitschaft und vertragliche Lieferzusage abstimmen.',['Expressversand automatisch als kostenlose Standardleistung behandeln.','Den Versand nach Auftragsschluss ohne Kundenvereinbarung berechnen.','Nur die Dauer des Transports betrachten.'],'Transportservice verändert Aufwand und wirtschaftliche Bedingungen des Auftrags.','Die Vertriebsentscheidung kann Kundennutzen und Marge in Einklang bringen.'],\r\n ['gefahrgutbewusstsein','Ein Werkstoff weist auf dem Sicherheitsdatenblatt besondere Handhabungshinweise auf. Was muss die Logistik vor Einlagerung tun?','Kennzeichnung, Lagerbedingungen und geltende betriebliche Schutzvorgaben prüfen.',['Das Sicherheitsdatenblatt nur im Einkauf archivieren.','Den Werkstoff mit allen Materialien zusammenlagern.','Lagerbedingungen ausschließlich nach verfügbarer Fläche wählen.'],'Sicherheits- und Lageranforderungen müssen vor der physischen Einlagerung berücksichtigt werden.','Gesundheits-, Sach- und Betriebsrisiken werden frühzeitig in der Lagerorganisation berücksichtigt.'],\r\n ['wareneingang','Eine Lieferung kommt außerhalb der vereinbarten Annahmezeit und niemand ist für die Prüfung verfügbar. Welche Prozessvorsorge ist hilfreich?','Annahmefenster und Vertretungsregel für kritische Lieferungen planen.',['Ware ungeprüft im Außenbereich abstellen.','Lieferantenzusage als Ersatz für Wareneingangskontrolle verwenden.','Den Wareneingang ohne Dokumentation buchen.'],'Ein abgestimmter Annahmeprozess sichert Prüfung, Dokumentation und korrekte Lagerung.','Beschädigung, Fehlmengen und ungeklärte Bestandszugänge werden weniger wahrscheinlich.'],\r\n ['versandplanung','Mehrere Aufträge sind fertig, aber ein gemeinsames Transportmittel hat begrenzte Kapazität. Wie sollte die Ladung priorisiert werden?','Liefertermine, Kundenrelevanz, Ladungssicherung und wirtschaftliche Bündelung berücksichtigen.',['Nur die räumlich nächstgelegenen Kunden bedienen.','Sendungen ohne Prüfung der Ladungssicherung maximieren.','Versand nach Auftragswert allein ordnen.'],'Eine belastbare Versandpriorität berücksichtigt Termine, Transportfähigkeit und Kundenfolgen.','Die knappe Transportkapazität wird transparent und risikoarm genutzt.'],\r\n ['bestandsklassifizierung','Einige wenige Artikel verursachen den größten Teil des Bestandswerts. Welche Analyse kann die Überwachung priorisieren?','Wertanteile klassifizieren und Kontrollintensität risikoorientiert festlegen.',['Alle Artikel unabhängig von Wert und Kritikalität gleich häufig prüfen.','Nur günstige Artikel überwachen.','Die wertvollsten Artikel ohne Zählung ausgeben.'],'Eine wertbezogene Klassifizierung unterstützt abgestufte Kontrolle, ersetzt aber keine Kritikalitätsprüfung.','Kontrollaufwand kann auf wirtschaftlich bedeutende Bestände konzentriert werden.'],\r\n ['lieferantenentwicklung','Ein Lieferant weist wiederholt schwankende Maßqualität auf, ist aber strategisch wichtig. Welche Maßnahme kann die Zusammenarbeit verbessern?','Ursachen- und Verbesserungsplan mit Qualitätsdaten, Verantwortlichen und Überprüfung vereinbaren.',['Lieferant sofort ohne Beleg dauerhaft ausschließen.','Qualitätsmängel akzeptieren, um die Beziehung zu erhalten.','Fehlerdaten nicht teilen.'],'Gemeinsame Ursachenarbeit ermöglicht Verbesserung und erhält zugleich klare Qualitätsanforderungen.','Fehlerquoten können sinken, ohne dass die Versorgung abrupt gefährdet wird.'],\r\n ['materialidentifikation','Ähnliche Werkstoffe liegen in unbeschrifteten Behältern; Verwechslungen sind möglich. Was ist die dringendste Prozessverbesserung?','Eindeutige Identifikation, Chargen- oder Artikelkennzeichnung und getrennte Lagerplätze sicherstellen.',['Material nach Farbe unterscheiden.','Behälter ohne Kennzeichnung nach Lagerort erinnern.','Werkstoffe ungeprüft an die Fertigung ausgeben.'],'Eindeutige Kennzeichnung ist Voraussetzung für sichere Auswahl und Rückverfolgbarkeit.','Falsche Materialverwendung und spätere Ursachenunklarheit werden reduziert.'],\r\n ['lieferketteninformation','Der Vertrieb erhält von einem Kunden eine Nachfrageänderung, die Einkauf erst Wochen später erfährt. Welche Informationsregel hilft?','Relevante Nachfrageänderungen zeitnah an Disposition und Einkauf übermitteln.',['Kundendaten nur in der Vertriebsabteilung halten.','Einkauf ausschließlich anhand vergangener Verbrauchswerte planen lassen.','Änderungen erst am Jahresende zusammenfassen.'],'Frühzeitige Informationsweitergabe erlaubt Anpassung von Bedarf und Bestellungen.','Überbestände und Fehlmengen aus veralteten Bedarfssignalen werden geringer.'],\r\n ['lagerlayout','Der Wareneingang kreuzt häufig den Weg der fertigen Versandaufträge. Welche Analyse unterstützt eine sichere Umgestaltung?','Materialwege, Kreuzungspunkte, Verkehrsregeln und Flächenbedarf aufnehmen.',['Nur die Anzahl der Regale zählen.','Transportwege verkürzen, ohne Verkehrsrisiken zu betrachten.','Den Versandbereich verkleinern, bevor Mengen analysiert sind.'],'Layoutplanung muss Effizienz und sichere Verkehrsführung gemeinsam berücksichtigen.','Kollisionen und unnötige Wege können sinken, während Arbeitsabläufe klarer werden.'],\r\n ['nachhaltige_logistik','Ein Lieferant verpackt jede Kleinteillieferung einzeln, wodurch viel Verpackungsabfall entsteht. Was kann der Einkauf prüfen?','Wiederverwendbare oder gebündelte Verpackungslösungen unter Qualitäts- und Transportanforderungen bewerten.',['Verpackung ersatzlos abschaffen, unabhängig vom Produktschutz.','Abfallmenge ignorieren, solange Material pünktlich ankommt.','Alle Teile in einer unsortierten Großkiste liefern lassen.'],'Verpackungslösungen müssen Abfall reduzieren und zugleich Schutz sowie Identifikation sichern.','Materialschäden und Entsorgungsaufwand können gleichzeitig berücksichtigt werden.'],\r\n ['logistiksteuerung','Ein Auftrag ist fertig, bleibt aber wegen fehlender Versanddokumentation im Lager. Welche Kennzahl oder Prozesskontrolle kann den Engpass sichtbar machen?','Zeit zwischen Fertigmeldung, Dokumentenfreigabe und tatsächlichem Versand messen.',['Nur die Produktionszeit erfassen.','Versandverzögerungen dem Kunden zurechnen.','Bestand nach Fertigmeldung aus dem System löschen.'],'Eine Durchlaufzeitmessung an der Schnittstelle zeigt, wo der fertige Auftrag wartet.','Dokumenten- und Versandabläufe lassen sich gezielt verbessern und Lagerliegezeiten senken.']\r\n);\r\nareas.push({id:'hsq-marketing-vertrieb',name:'Marketing und Vertrieb',paragraph:4,items:[\r\n ['marketingplanung','Die Anfragezahlen steigen, doch viele Interessenten passen nicht zur Fertigungsausstattung. Welcher Marketingplanungsschritt ist sinnvoll?','Zielkundensegmente und deren Anforderungen mit den eigenen Leistungsmerkmalen abgleichen.',['Alle Anfragen unabhängig von Passung als Zielgruppe behandeln.','Werbebudget allein nach Klickzahlen erhöhen.','Die Fertigungsausstattung in der Marktanalyse ignorieren.'],'Eine passende Zielgruppe erhöht die Chance, dass Marketingkontakte zu erfüllbaren Aufträgen werden.','Vertrieb kann Aufwand auf Segmente richten, die der Betrieb profitabel bedienen kann.'],\r\n ['marktforschung','Ein neuer Wettbewerber bietet günstigere Standardteile an; unklar ist, ob die eigenen Kunden vergleichbare Leistungen sehen. Wie sollte der Betrieb vorgehen?','Kundenanforderungen, Vergleichsprodukte und Entscheidungskriterien gezielt erheben.',['Preise sofort senken, ohne Vergleichbarkeit zu prüfen.','Kundenmeinungen durch interne Vermutungen ersetzen.','Nur den Webauftritt des Wettbewerbers beobachten.'],'Marktforschung klärt, ob Angebote tatsächlich vergleichbar sind und worauf Kunden Wert legen.','Preisentscheidungen können an echtem Kundennutzen statt an Vermutungen ausgerichtet werden.'],\r\n ['segmentierung','Großkunden verlangen Rahmenplanung, während kleine Werkstätten kurzfristige Einzelteile benötigen. Was ermöglicht eine Segmentierung?','Angebote und Kommunikationswege an die unterschiedlichen Bedarfsmuster anpassen.',['Allen Kunden identische Konditionen und Lieferprozesse anbieten.','Kunden ausschließlich nach Unternehmensnamen gruppieren.','Die kleinere Kundengruppe aus der Analyse entfernen.'],'Bedarfsspezifische Segmente helfen, passende Leistungen und Prozesse zu gestalten.','Vertrieb kann Serviceaufwand und Angebotsform an Kundennutzen ausrichten.'],\r\n ['positionierung','Ein kleiner Zulieferer kann keine Preisführerschaft beanspruchen, reagiert aber sehr flexibel auf Sonderwünsche. Wie sollte er sich positionieren?','Flexibilität als belegbares Nutzenversprechen für passende Kundengruppen herausstellen.',['Die niedrigsten Preise behaupten, ohne die Kosten zu prüfen.','Alle möglichen Wettbewerbsvorteile gleichzeitig versprechen.','Die eigene Stärke nicht kommunizieren.'],'Eine glaubwürdige Positionierung knüpft an tatsächliche Fähigkeiten an.','Kunden mit Bedarf an flexibler Fertigung erkennen den Mehrwert und Preisvergleiche werden sachgerechter.'],\r\n ['marketingmix','Ein technisches Servicepaket wird selten gebucht, obwohl Kunden Stillstandsrisiken nennen. Welche Maßnahme prüft direkt, ob die angebotenen Serviceleistungen den von Kunden genannten Stillstandsrisiken entsprechen?','Mit Kunden, die Stillstandsrisiken genannt haben, strukturierte Bedarfsgespräche zu Nutzen und Leistungsumfang führen.',['Die Angebotsdarstellung anhand häufiger Rückfragen überarbeiten und den Leistungsumfang unverändert lassen.','Bisherige Angebotskonversion und Preisnachlässe auswerten, ohne Kunden nach den benötigten Serviceleistungen zu fragen.','Den Preis als Qualitätsindikator testen und die Reaktion der Kunden vor einer Überarbeitung des Leistungsumfangs beobachten.'],'Die Elemente des Marketingmix müssen zum Bedarf und zur Wahrnehmung der Kunden passen.','Ein passendes Angebot kann besser verständlich und erreichbar werden.'],\r\n ['produktpolitik','Kunden fragen zunehmend nach dokumentierter Qualitätsprüfung zu Einzelteilen. Welche Produktpolitikoption sollte geprüft werden?','Prüfdokumentation als klar abgegrenzte Zusatzleistung oder Leistungsmerkmal gestalten.',['Die Dokumentation ohne Kostenprüfung für jeden Auftrag zusagen.','Die Kundenanforderung als reine Preisfrage behandeln.','Die Prüfprozesse unverändert lassen und den Nutzen behaupten.'],'Eine Zusatzleistung sollte konkret definiert und auf Aufwand sowie Kundennutzen geprüft werden.','Der Betrieb kann Leistungen differenzieren und Prüfaufwand in die Kalkulation aufnehmen.'],\r\n ['preispolitik','Ein Interessent vergleicht das Angebot nur anhand des Stückpreises, obwohl die eigene Lösung kürzere Lieferzeit bietet. Wie kann Vertrieb reagieren?','Gesamtnutzen und relevante Leistungsunterschiede quantifizieren und verständlich darstellen.',['Den Preis sofort unter Wettbewerbsniveau senken.','Lieferzeit als unwichtig erklären.','Nicht vergleichbare Wettbewerbsangebote als identisch behandeln.'],'Preisverhandlungen können den Gesamtwert betrachten, wenn Unterschiede belastbar belegt werden.','Der Betrieb kann Marge eher erhalten, wenn der Kundennutzen tatsächlich relevant ist.'],\r\n ['vertriebsmanagement','Viele Angebote werden erstellt, aber Vertriebsmitarbeitende verfolgen sie uneinheitlich nach. Welche Prozessverbesserung ist sinnvoll?','Phasen, Verantwortliche und Wiedervorlagezeitpunkte der Pipeline verbindlich definieren.',['Alle offenen Angebote täglich ohne Priorität anrufen.','Verlorene Angebote aus der Pipeline löschen.','Das Angebotsdatum als sicheren Auftragseingang behandeln.'],'Ein standardisierter Prozess erhöht Nachverfolgung und Prognosequalität.','Chancen werden systematisch betreut und Vertriebskapazität besser verteilt.'],\r\n ['vertriebsmanagement','Ein Kunde erhält von Vertrieb und Technik unterschiedliche Aussagen zum Liefertermin. Welche Maßnahme sollte der Betrieb treffen?','Terminbestätigung aus einer abgestimmten Quelle mit klarer Freigabeverantwortung sicherstellen.',['Beide Angaben dem Kunden gleichzeitig überlassen.','Vertrieb soll Termine ohne Fertigungsabgleich zusagen.','Technische Terminprognosen grundsätzlich ausblenden.'],'Konsistente Zusagen erfordern Abstimmung zwischen Marktversprechen und Kapazitätsplan.','Vertrauen und Lieferplanung werden weniger durch widersprüchliche Zusagen belastet.'],\r\n ['kundenbindung','Ein langjähriger Kunde bestellt weniger, antwortet aber weiterhin auf Rückfragen. Welche Vorgehensweise ist angemessen?','Im strukturierten Gespräch Bedarf, Zufriedenheit und Veränderungen im Beschaffungsprozess ermitteln.',['Sofort einen pauschalen Rabatt gewähren.','Rückgang als sichere Kündigung werten.','Den Kontakt nur bei neuen Aufträgen aufnehmen.'],'Ein offener Dialog liefert Hinweise auf Ursachen und mögliche passende Lösungen.','Der Betrieb kann Abwanderungsrisiken früher erkennen und Kundenbeziehung gezielt entwickeln.'],\r\n ['kundenbindung','Eine Reklamation wird innerhalb eines Tages gelöst, aber der Kunde erhält keine Rückmeldung zum Abschluss. Was ist im Serviceprozess zu ergänzen?','Ergebnis und vereinbarte Folgemaßnahme aktiv an den Kunden kommunizieren.',['Den Vorgang intern schließen, sobald ein Ersatzteil versandt ist.','Die Rückmeldung dem Kunden überlassen.','Jede Reklamation mit einem Rabatt beenden.'],'Kunden benötigen Klarheit über Lösung und Prävention, nicht nur interne Bearbeitung.','Transparenz kann Vertrauen und Wiederkaufbereitschaft stärken.'],\r\n ['marktanalyse','Ein saisonaler Nachfrageanstieg wird als dauerhaftes Marktwachstum interpretiert. Welche Analyse schützt vor Fehlplanung?','Mehrjährige beziehungsweise saisonbereinigte Entwicklung und Marktursachen vergleichen.',['Nur den stärksten Monat annualisieren.','Schwache Saisonmonate aus der Statistik streichen.','Auftragseingang und Nachfrage grundsätzlich gleichsetzen.'],'Saisonalität und struktureller Trend sind verschiedene Effekte.','Kapazitäts- und Lagerplanung beruhen weniger auf vorübergehenden Spitzen.'],\r\n ['absatzprognose','Ein Großkunde kündigt unverbindlich einen möglichen Folgeauftrag an. Wie sollte der Vertrieb diese Information in der Absatzplanung behandeln?','Wahrscheinlichkeit und Status kenntlich machen und als Szenario statt sicheren Auftrag führen.',['Den gesamten Wert als fest zugesagten Umsatz einplanen.','Die Chance aus der Planung verbannen.','Den Auftrag ohne Angebot als Auftragseingang verbuchen.'],'Unverbindliche Chancen benötigen eine andere Gewichtung als bestätigte Aufträge.','Produktions- und Liquiditätsplanung überhöhen die sichere Nachfrage nicht.'],\r\n ['werbung','Eine Fachmesse zieht viele Besucher, aber wenige passende B2B-Kontakte an. Welche Auswertung ist für die nächste Messeentscheidung relevant?','Qualifizierte Leads, Kosten, Folgeangebote und gewonnene Aufträge analysieren.',['Nur die Gesamtzahl der Standbesuche messen.','Messekosten ignorieren, weil Sichtbarkeit nicht messbar ist.','Jeden Messekontakt als Kunden zählen.'],'Die Wirkung sollte an Zielgruppe und nachgelagertem Vertriebsergebnis beurteilt werden.','Marketingbudget kann auf Veranstaltungen mit relevanter Reichweite konzentriert werden.'],\r\n ['distributionspolitik','Ein Kunde in einer entfernten Region benötigt häufige kleine Lieferungen. Welche Distributionsentscheidung sollte geprüft werden?','Transportkosten, Lieferfrequenz und mögliche Bündelung oder regionale Partner vergleichen.',['Jede Lieferung ungeachtet der Kosten als Express versenden.','Lieferfrequenz reduzieren, ohne Kundenbedarf abzustimmen.','Nur den Fertigungsstandort betrachten.'],'Distribution umfasst Zugangs- und Lieferwege und beeinflusst Service sowie Kosten.','Der Betrieb kann Lieferfähigkeit und Logistikaufwand besser in Einklang bringen.'],\r\n ['angebotsgestaltung','Ein Angebot enthält technische Details, aber der Kunde versteht nicht, welche Leistung im Preis enthalten ist. Was sollte verbessert werden?','Leistungsumfang, Annahmen, Ausschlüsse und optionale Leistungen klar strukturieren.',['Mehr technische Abkürzungen ergänzen.','Nicht enthaltene Leistungen bewusst unerwähnt lassen.','Den Gesamtpreis ohne Leistungsbeschreibung nennen.'],'Klare Angebotsbestandteile reduzieren Missverständnisse und erleichtern den Vergleich.','Nachverhandlungen über Leistungsumfang und unerwartete Zusatzkosten werden seltener.'],\r\n ['preisverhandlung','Der Kunde bittet um Preisnachlass, kann dafür aber eine größere Losgröße zusagen. Wie sollte Vertrieb den Vorschlag bewerten?','Nachlass gegen tatsächliche Kosten- und Planungsvorteile der größeren Losgröße rechnen.',['Den Rabatt ohne Gegenrechnung sofort geben.','Größere Lose grundsätzlich als kostenneutral behandeln.','Den vereinbarten Preis nach Vertragsannahme einseitig ändern.'],'Eine Gegenleistung kann Kosten senken, muss aber in der konkreten Kalkulation belegt sein.','Preisnachlässe werden eher an messbare Effizienzvorteile gekoppelt.'],\r\n ['preisstrategie','Die Materialkosten steigen während der Laufzeit eines Angebots, das noch nicht angenommen wurde. Welche Handlung ist angemessen?','Gültigkeitsdauer und Kalkulationsannahmen prüfen und vor Annahme gegebenenfalls ein aktualisiertes Angebot abstimmen.',['Preis unabhängig von Gültigkeitsbedingungen beliebig erhöhen.','Materialkostensteigerung stets allein dem Kunden auferlegen.','Das Angebot trotz abgelaufener Grundlage unverändert als bindend behandeln.'],'Vor Vertragsschluss hängen Preisänderungsmöglichkeiten von Angebotsinhalt und Fristen ab.','Der Betrieb schützt Kalkulation und wahrt zugleich klare Kundenkommunikation.'],\r\n ['vertragsrecht','Ein Kunde nimmt ein schriftliches Angebot fristgerecht ohne Änderungen an. Was sollte der Vertrieb nach Eingang der Annahme tun?','Auftragsbestätigung und Übergabe an die Ausführung mit vereinbartem Leistungsumfang sicherstellen.',['Den vereinbarten Preis anschließend einseitig neu kalkulieren.','Die Annahme ignorieren, bis der Kunde nochmals anruft.','Zusatzleistungen ohne Vereinbarung in den Auftrag aufnehmen.'],'Eine wirksame Annahme begründet die vereinbarten Bedingungen; Änderungen benötigen eine abgestimmte Grundlage.','Verlässliche Übergabe verhindert Preis- und Leistungsstreit im späteren Auftragsverlauf.'],\r\n ['internationalisierung','Ein Kunde aus einem anderen Land fordert Angebote in einer fremden Währung. Was sollte Vertrieb in der Kalkulation zusätzlich berücksichtigen?','Währungsrisiko, Zahlungsbedingungen, Lieferkosten und anwendbare Vertragsbedingungen prüfen.',['Den Umrechnungskurs des Angebotstags dauerhaft garantieren.','Internationale Logistikkosten mit Inlandskosten gleichsetzen.','Zahlungs- und Rechtsbedingungen nicht dokumentieren.'],'Grenzüberschreitende Geschäfte können zusätzliche Kosten und Risiken haben, die vor Zusage geklärt werden.','Angebotspreis und Zahlungsplanung bilden die tatsächlichen Rahmenbedingungen besser ab.'],\r\n ['interkulturelle_kommunikation','In einer Verhandlung werden knappe Antworten des ausländischen Geschäftspartners als Ablehnung verstanden, obwohl die Sachlage unklar ist. Wie sollte das Team reagieren?','Bedeutung durch offene Rückfragen klären und Kommunikationsannahmen nicht vorschnell bewerten.',['Die Verhandlung sofort abbrechen.','Kulturelle Stereotype als sichere Erklärung verwenden.','Die eigene Position wiederholen, ohne Verständnis zu prüfen.'],'Klärende Fragen reduzieren Missverständnisse und vermeiden unbelegte Zuschreibungen.','Verhandlungspartner können Erwartungen und nächste Schritte präziser abstimmen.'],\r\n ['crm','Kundenkontakte sind in verschiedenen persönlichen Tabellen verteilt; wichtige Absprachen gehen verloren. Welche Vertriebsmaßnahme hilft?','Kundendaten und Kontaktverlauf in einer gepflegten, zugriffsgeregelten Übersicht dokumentieren.',['Alle Tabellen ohne Berechtigungen zusammenführen.','Historische Absprachen nach jedem Auftrag löschen.','Nur persönliche Erinnerung als CRM nutzen.'],'Zentral dokumentiertes und gepflegtes Wissen macht die Kundenbeziehung teamfähig.','Vertretung und konsistente Betreuung werden erleichtert, ohne Datenschutzanforderungen auszublenden.'],\r\n ['absatzkontrolle','Die Zahl neu gewonnener Kunden steigt, der durchschnittliche Deckungsbeitrag sinkt jedoch. Was sollte Marketing und Vertrieb untersuchen?','Neukundensegmente, Akquisitionskosten, Preise und Auftragsprofitabilität analysieren.',['Kundenzuwachs allein als Erfolg werten.','Niedrigere Beiträge durch mehr Kunden automatisch kompensieren.','Akquisitionskosten nicht den Kundengruppen zuordnen.'],'Wachstum ist nur dann wirtschaftlich, wenn Beitrag und Kosten zusammen betrachtet werden.','Vertrieb kann Kundenakquise auf tragfähige Segmente konzentrieren.'],\r\n ['sortimentspolitik','Ein selten bestelltes Produkt bindet viel Entwicklungs- und Lageraufwand, wird aber von einem strategischen Kunden benötigt. Wie sollte die Sortimentsentscheidung erfolgen?','Kundenwert, Vollkosten, strategische Bedeutung und alternative Bereitstellung vergleichen.',['Das Produkt ausschließlich nach Absatzmenge streichen.','Es unbegrenzt weiterführen, ohne Aufwand zu erfassen.','Den strategischen Kunden ohne Gespräch kündigen.'],'Eine Sortimentsentscheidung muss quantitative und qualitative Gründe transparent abwägen.','Das Unternehmen kann Kundenbindung und Wirtschaftlichkeit mit geeigneten Sonderkonditionen verbinden.'],\r\n ['kommunikation','Eine Werbeaussage verspricht eine Lieferzeit, die der Betrieb nur bei freier Kapazität einhalten kann. Was sollte vor Veröffentlichung erfolgen?','Aussage mit Fertigungskapazität und belastbaren Lieferbedingungen abstimmen.',['Die Aussage veröffentlichen und Ausnahmen später erklären.','Die Kapazitätsannahme aus der Planung entfernen.','Eine kürzere Lieferzeit wählen, um Aufmerksamkeit zu erzeugen.'],'Marketingversprechen müssen durch realisierbare Leistung und klare Voraussetzungen gedeckt sein.','Fehlzusagen und Vertrauensverlust durch nicht erfüllbare Werbeaussagen werden reduziert.']\r\n]});\r\nareas[3].items.push(\r\n ['marketingziele','Die Geschäftsführung setzt für eine neue Produktlinie ein Ziel „mehr Bekanntheit“, möchte aber später den Erfolg prüfen. Wie sollte das Ziel konkretisiert werden?','Zielgruppe, Messgröße, Ausgangswert, Zeitraum und angestrebte Veränderung festlegen.',['Nur die Zahl der Werbebeiträge als Bekanntheit messen.','Den Zielwert nach Ablauf der Kampagne auswählen.','Bekanntheit ohne definiertes Publikum vergleichen.'],'Ein operationalisiertes Marketingziel braucht Zielgruppe und messbares Kriterium.','Das Budget kann anhand einer überprüfbaren Wirkung statt bloßer Aktivität beurteilt werden.'],\r\n ['marketingforschung','Ein Wettbewerber veröffentlicht niedrige Preise, aber keine Informationen zu Lieferumfang und Service. Was sollte Vertrieb vor einem Preisvergleich klären?','Leistungsumfang, Mengen, Lieferbedingungen und Service der Angebote vergleichbar machen.',['Den veröffentlichten Einzelpreis als vollständigen Vergleich verwenden.','Eigene Serviceleistungen aus dem Angebot entfernen.','Wettbewerberpreis ungeprüft als Marktpreis für alle Kunden übernehmen.'],'Nur vergleichbare Leistungen erlauben eine sachgerechte Preisbewertung.','Unbegründete Preisnachlässe werden vermieden und Angebotsvorteile können eingeordnet werden.'],\r\n ['marktsegment','Ein Teil der Kunden kauft wegen dokumentierter Rückverfolgbarkeit, andere ausschließlich wegen kurzer Lieferzeit. Wie kann Vertrieb die Ansprache differenzieren?','Kunden nach ihren wichtigsten Kaufkriterien segmentieren und passende Nutzenargumente entwickeln.',['Allen Kunden denselben Vorteil hervorheben.','Segmente ausschließlich nach geografischer Entfernung bilden.','Die unterschiedlichen Kaufmotive als zufällige Einzelfälle behandeln.'],'Segmentierung nach Bedarf ermöglicht relevante Kommunikation und passende Leistungsbündel.','Vertrieb kann bessere Passung erreichen, ohne jedem Kunden dieselbe Leistung aufzudrängen.'],\r\n ['positionierung','Ein Betrieb wirbt mit „Premiumqualität“, obwohl Reklamationsdaten keine besondere Qualitätsposition belegen. Was sollte Marketing tun?','Aussage durch überprüfbare Leistungsmerkmale belegen oder realistisch neu formulieren.',['Die Aussage häufiger wiederholen, damit sie glaubwürdig wird.','Qualitätsdaten nicht mit Werbeaussagen verbinden.','Kundenreklamationen aus der internen Statistik entfernen.'],'Eine Positionierung sollte mit tatsächlich belegbarer Leistung übereinstimmen.','Das Unternehmen senkt Irreführungs- und Vertrauensrisiken und richtet Versprechen auf echte Stärken aus.'],\r\n ['marketingmix','Eine neue Zielgruppe kennt den Betrieb, aber Anfragen brechen an einem umständlichen Kontaktprozess ab. Welcher Marketingbereich sollte zuerst verbessert werden?','Distribution beziehungsweise Zugang zum Angebot und Vertriebsprozess überprüfen.',['Die Produktvorteile stärker kommunizieren und den Aufwand des Anfragewegs in einer späteren Vertriebsanalyse prüfen.','Das Kontaktformular verkürzen, auch wenn dadurch zunächst Angaben zur konkreten Angebotsqualifizierung fehlen.','Die Bekanntheit der Zielgruppe durch zusätzliche Werbung erhöhen und den bestehenden Anfrageweg zunächst beibehalten.'],'Marketing umfasst neben Bekanntheit auch Zugang und Vertriebsweg.','Interessenten können mit geringerem Aufwand in qualifizierte Anfragen übergehen.'],\r\n ['produktpolitik','Kunden fragen häufig nach unterschiedlichen technischen Varianten, die kleine Änderungen in der Fertigung erfordern. Welche Produktentscheidung ist sinnvoll?','Variantenbedarf, Fertigungsaufwand und Zahlungsbereitschaft systematisch prüfen.',['Jede gewünschte Variante ohne Standardisierung aufnehmen.','Alle Sonderwünsche pauschal ablehnen.','Entwicklungs- und Rüstaufwand im Produktangebot ausblenden.'],'Varianten können Nutzen schaffen, erhöhen aber Komplexität und Kosten.','Das Sortiment bleibt kundengerecht, ohne unkontrolliert Fertigungs- und Lagerkomplexität aufzubauen.'],\r\n ['preispolitik','Ein Angebot erzielt viele Zuschläge, aber der Betrieb kann die vereinbarten Termine nur mit teuren Überstunden einhalten. Was sollte die Preisprüfung ergänzen?','Kapazitäts- und Eilkosten in die Angebotskalkulation einbeziehen.',['Die Zuschlagsquote als ausreichenden Gewinnnachweis behandeln.','Überstunden unabhängig von Auftragsbeitrag als kostenlos ansehen.','Den Preis nach Annahme einseitig erhöhen.'],'Eine hohe Zuschlagsquote kann wirtschaftlich problematisch sein, wenn die Kalkulation den Kapazitätsaufwand verfehlt.','Angebote berücksichtigen stärker, ob Marge und Lieferfähigkeit gemeinsam tragfähig sind.'],\r\n ['vertriebsmanagement','Ein Mitarbeiter verspricht im Verkauf Sonderkonditionen, die intern nicht freigegeben wurden. Welche Prozessregel hilft?','Rabatt- und Angebotsbefugnisse mit klaren Schwellen und Freigabeschritten definieren.',['Jeden Rabatt nachträglich ohne Prüfung akzeptieren.','Vertriebsmitarbeitende ohne Befugnis über Preise entscheiden lassen.','Preisverhandlungen generell verbieten.'],'Definierte Spielräume beschleunigen Routinefälle und sichern Kontrolle bei größeren Abweichungen.','Marge und Kundenzusagen werden verlässlicher gesteuert.'],\r\n ['vertriebsmanagement','Die Pipeline enthält viele Angebote ohne nächsten Kontakttermin. Wie kann die Vertriebsleitung die Prognose verbessern?','Für jede Verkaufschance Status, erwarteten nächsten Schritt und Begründung der Wahrscheinlichkeit pflegen.',['Alle Chancen mit identischer Abschlusswahrscheinlichkeit ansetzen.','Angebote nach einer Woche automatisch als gewonnen markieren.','Nur verlorene Chancen dokumentieren.'],'Aktualisierte Phasen und nächste Aktivitäten erhöhen Nachverfolgbarkeit und Prognosegüte.','Kapazität wird eher für reale Chancen eingeplant und veraltete Angebote fallen auf.'],\r\n ['kundenbindung','Ein Stammkunde wechselt den Ansprechpartner und kennt die bisherigen Sondervereinbarungen nicht. Welche Maßnahme sichert die Beziehung?','Vereinbarungen und Kontaktverlauf dokumentieren und den neuen Ansprechpartner strukturiert einführen.',['Den Kunden auffordern, alle Absprachen erneut nachzuweisen.','Sondervereinbarungen unkontrolliert weiterführen.','Die Kundenhistorie aus Datenschutzgründen vollständig löschen.'],'Geregelte Dokumentation ermöglicht Kontinuität bei einem Ansprechpartnerwechsel.','Der Kunde erlebt eine konsistente Betreuung und der Betrieb vermeidet widersprüchliche Konditionen.'],\r\n ['kundenservice','Ein Auftrag verspätet sich; die Fertigung kennt den Grund, der Kunde wurde aber noch nicht informiert. Wie sollte der Vertrieb reagieren?','Belastbaren neuen Termin und Handlungsoptionen mit der Fertigung klären und den Kunden zeitnah informieren.',['Den ursprünglich zugesagten Termin weiter bestätigen.','Die Verzögerung erst nach Kundenbeschwerde mitteilen.','Ohne Klärung einen beliebigen Ersatztermin zusagen.'],'Frühzeitige und abgestimmte Kommunikation erhält Handlungsspielraum und Glaubwürdigkeit.','Kunden können eigene Abläufe anpassen und Eskalationen werden eher vermieden.'],\r\n ['absatzprognose','Ein einmaliger Großauftrag lässt den Monatsumsatz stark steigen. Wie sollte die Absatzplanung den Effekt behandeln?','Einmalauftrag gesondert ausweisen und wiederkehrenden Grundbedarf separat prognostizieren.',['Den Spitzenmonat als neue Norm hochrechnen.','Den Auftrag aus der Umsatzhistorie löschen.','Den Einmalauftrag als sichere Folgejahresnachfrage werten.'],'Sondereffekte dürfen nicht ungeprüft als dauerhafter Trend fortgeschrieben werden.','Kapazitäts- und Umsatzplanung bleiben realistischer für Folgeperioden.'],\r\n ['marketingbudget','Ein Unternehmen verteilt Werbebudget gleichmäßig auf alle Kanäle, obwohl nur wenige qualifizierte Leads entstehen. Was sollte es auswerten?','Kosten je qualifiziertem Kontakt und nachgelagerte Auftragsbeiträge pro Kanal vergleichen.',['Impressionen als alleinige Erfolgsgröße verwenden.','Alle Kanäle unabhängig vom Ergebnis weiter finanzieren.','Kampagnenkosten aus der Wirtschaftlichkeitsbetrachtung auslassen.'],'Kanalwirkung sollte an Zielgruppenpassung und wirtschaftlichem Folgeergebnis gemessen werden.','Budget kann auf wirksame Kanäle konzentriert und Streuverlust reduziert werden.'],\r\n ['distributionspolitik','Ein Kunde möchte seine Ware selbst abholen, statt den Spediteur zu nutzen. Was muss der Betrieb vor Zusage abstimmen?','Bereitstellung, Übergabezeitpunkt, Verpackung und vereinbarte Verantwortungsübergänge klären.',['Den Auftrag ohne geänderte Absprachen im Versandprozess lassen.','Abholkosten automatisch als zusätzlichen Umsatz buchen.','Ware ohne Abholnachweis aus dem Lagerbestand ausbuchen.'],'Ein geänderter Lieferweg benötigt klare logistische Abläufe und Dokumentation.','Übergabefehler und Missverständnisse über Lieferverantwortung werden reduziert.'],\r\n ['angebotsgestaltung','Ein Kunde möchte mehrere Leistungsvarianten vergleichen. Wie sollte das Angebot gestaltet werden?','Varianten mit vergleichbarem Leistungsumfang, Preis und Liefertermin strukturiert gegenüberstellen.',['Eine Variante detailliert und andere ohne Leistungsbeschreibung anbieten.','Zusatzoptionen in den Gesamtpreis mischen, ohne sie zu benennen.','Dem Kunden die interne Kalkulation statt eines Angebots senden.'],'Vergleichbare Varianten unterstützen eine informierte Kundenauswahl.','Entscheidung und spätere Auftragserfüllung werden klarer, Zusatzleistungen bleiben nachvollziehbar.'],\r\n ['preisverhandlung','Der Kunde schlägt eine längere Vertragslaufzeit gegen einen Preisnachlass vor. Welche Kalkulation ist erforderlich?','Mengen- oder Planungsvorteile gegen Preisbindung, Risiko und erwartete Kostenentwicklung rechnen.',['Die längere Laufzeit ohne Kostenprüfung als sicheren Vorteil ansehen.','Den Nachlass dauerhaft gewähren, ohne Mindestmengen festzulegen.','Preisrisiken durch einseitige Anpassung nach Vertragsschluss lösen.'],'Eine längere Bindung kann Planungsvorteile, aber auch Preis- und Flexibilitätsrisiken mitbringen.','Konditionen werden an belastbare Gegenleistungen und klare Vertragsbedingungen geknüpft.'],\r\n ['vertragsrecht','Ein Kunde möchte nach Auftragserteilung eine zusätzliche Prüfung und einen früheren Liefertermin. Was sollte Vertrieb tun?','Leistungsänderung, Machbarkeit, Mehrkosten und Terminwirkung abstimmen und dokumentieren.',['Zusatzleistung ohne Preis- oder Terminprüfung zusagen.','Nachträglich eine Gebühr ohne Vereinbarung berechnen.','Den ursprünglichen Auftrag als nichtig behandeln.'],'Nachträgliche Änderungen erfordern abgestimmte Leistungs- und Preisbedingungen.','Der Betrieb kann Zusatzwünsche erfüllen, ohne Umfang, Marge und Lieferplan unklar zu lassen.'],\r\n ['internationalisierung','Ein Auslandsinteressent verlangt ein Angebot mit Lieferung an einen neuen Zielort. Welche logistischen und kaufmännischen Punkte sind zu klären?','Transportweg, Kosten, Lieferbedingungen, Währung und Zahlungsrisiko prüfen.',['Inlandspreis und Inlandslieferzeit unverändert übernehmen.','Wechselkurs und Transportkosten als irrelevant behandeln.','Zielort erst nach Versand erfragen.'],'Neue Absatzgebiete können zusätzliche Kosten und Vertragsbedingungen auslösen.','Die Angebotsmarge und Lieferzusage berücksichtigen die tatsächliche Distanz und Abwicklung.'],\r\n ['interkulturelle_kommunikation','Ein Geschäftspartner signalisiert Zustimmung in einem Gespräch, bestätigt den Umfang aber nicht schriftlich. Was sollte das Vertriebsteam tun?','Gemeinsames Verständnis, offene Punkte und nächste Schritte schriftlich zusammenfassen und bestätigen lassen.',['Die Gesprächsreaktion als vollständige Vertragsannahme behandeln.','Die offenen Punkte nicht mehr ansprechen.','Den Umfang intern nach eigener Auslegung festlegen.'],'Zusammenfassung und Bestätigung reduzieren Interpretationsunterschiede.','Die Parteien können Missverständnisse über Leistung und Verbindlichkeit früh klären.'],\r\n ['crm','Kundenbeschwerden werden erfasst, aber nicht nach Produkt, Ursache oder Wiederholung ausgewertet. Welche CRM-Nutzung fehlt?','Beschwerdedaten strukturiert analysieren und Erkenntnisse an Produkt- und Prozessverantwortliche zurückführen.',['Einzelbeschwerden isoliert schließen.','Kundendaten nur für Werbeversand verwenden.','Wiederholungen wegen bereits erfolgter Lösung ignorieren.'],'CRM kann neben Vertrieb auch Muster und Verbesserungsbedarf sichtbar machen.','Produkt- und Prozessverbesserungen können auf wiederkehrenden Kundensignalen beruhen.'],\r\n ['absatzkontrolle','Eine Kampagne hat ihr Umsatzziel erreicht, aber durch hohe Rabatte einen deutlich geringeren Deckungsbeitrag erzielt. Wie ist der Erfolg zu bewerten?','Umsatzergebnis und Deckungsbeitrag gemeinsam mit Kampagnenkosten beurteilen.',['Zielerreichung beim Umsatz als vollständigen Erfolg werten.','Rabatte als zusätzlichen Absatz verbuchen.','Kampagnenkosten ignorieren, weil Umsatz einging.'],'Umsatz allein zeigt nicht, ob eine Kampagne wirtschaftlichen Beitrag leistet.','Marketing kann künftige Aktionen auf profitable Kunden und Konditionen ausrichten.'],\r\n ['sortimentspolitik','Ein Produkt verursacht viele Variantenwechsel und geringe Stückzahlen, wird aber in Kombination mit anderen Leistungen verkauft. Was sollte vor einer Streichung geprüft werden?','Direkter Beitrag, Verbundwirkung und Auswirkungen auf Kundenbeziehungen untersuchen.',['Nur die isolierte Stückzahl für die Entscheidung verwenden.','Verbundeffekte als grundsätzlich nicht messbar abtun.','Das Produkt ohne Kundenprüfung sofort auslisten.'],'Produkte können indirekten Nutzen oder Verbundumsatz erzeugen; dieser muss nachvollziehbar bewertet werden.','Sortimentsentscheidungen berücksichtigen tatsächliche Kunden- und Ergebniswirkungen.'],\r\n ['kommunikation','Ein Werbetext behauptet eine Zertifizierung, die für das konkrete Produkt nicht gilt. Was muss das Marketingteam tun?','Aussage korrigieren und Produktbezug sowie Nachweis vor Verwendung prüfen.',['Die Aussage wegen des Unternehmenszertifikats unverändert lassen.','Den Hinweis klein drucken und den falschen Eindruck beibehalten.','Die Zertifizierung als Marketingbegriff ohne Beleg behandeln.'],'Produktbezogene Werbeaussagen müssen sachlich belegt und nicht irreführend sein.','Der Betrieb senkt rechtliche und reputative Risiken durch korrekte Kommunikation.'],\r\n ['marketingcontrolling','Die Website erzeugt viele Anfragen, aber die meisten sind technisch nicht erfüllbar. Welche Kennzahl hilft die Kampagne gezielter zu bewerten?','Anteil qualifizierter, zum Leistungsprofil passender Leads messen.',['Nur Seitenaufrufe erhöhen.','Jede Anfrage als Verkaufschance zählen.','Unpassende Anfragen aus dem Bericht löschen.'],'Leadqualität misst die Passung zum Zielkunden und nicht nur Reichweite.','Marketing und Fertigung verschwenden weniger Aufwand auf nicht realisierbare Angebote.'],\r\n ['kundensegmentierung','Ein Kunde kauft selten, aber mit hoher Marge und geringer Sonderbetreuung; ein anderer bestellt häufig mit vielen Reklamationen. Wie sollte die Betreuung priorisiert werden?','Kundenwert und Betreuungsaufwand anhand geeigneter Kriterien differenziert analysieren.',['Betreuung ausschließlich nach Bestellhäufigkeit priorisieren.','Den Kunden mit Reklamationen automatisch kündigen.','Nur Umsatz ohne Kosten- und Zukunftssicht vergleichen.'],'Kundensegmentierung kann Ertrag, Aufwand und strategische Bedeutung berücksichtigen.','Service- und Vertriebsressourcen werden bewusster auf tragfähige Beziehungen verteilt.'],\r\n ['preisstrategie','Ein Kunde fordert einen Festpreis für ein Projekt mit unsicherem Materialverbrauch. Wie sollte das Angebot abgesichert werden?','Verbrauchsannahmen, Leistungsumfang und Umgang mit Änderungen klar vereinbaren.',['Puffer ohne Dokumentation in den Preis einrechnen.','Festpreis ohne Mengen- oder Änderungsgrenzen zusagen.','Mehrverbrauch nachträglich ohne vorherige Vereinbarung berechnen.'],'Klare Annahmen und Änderungsregeln verteilen Unsicherheit nachvollziehbar.','Preisrisiko aus Verbrauchsabweichungen wird besser steuerbar und der Kunde kennt den Angebotsumfang.']\r\n);\r\nareas.push({id:'hsq-fuehrung-zusammenarbeit',name:'Führung und Zusammenarbeit',paragraph:5,items:[\r\n ['kommunikation','Eine Schichtübergabe lässt offen, ob ein Auftrag bereits geprüft wurde. Welche Kommunikationsstruktur verhindert Missverständnisse?','Auftragsstatus, offene Prüfung, Verantwortlichen und nächsten Schritt standardisiert übergeben.',['Nur die Anwesenheit der Schicht protokollieren.','Unklare Punkte bis zum nächsten Fehler offenlassen.','Jede Schicht eigene Statusbegriffe verwenden lassen.'],'Eine strukturierte Übergabe vermittelt die für die Anschlussarbeit nötigen Informationen.','Doppelprüfungen und ungeprüfte Weiterbearbeitung werden seltener.'],\r\n ['kommunikation','Ein Mitarbeiter meldet einen Fehler; Ablauf und Ursache sind zunächst unklar. Welche erste Reaktion ermöglicht eine belastbare Ursachenklärung, ohne Verantwortung vorwegzunehmen?','Zunächst Beobachtungen und Abläufe erfragen und zwischen Ursache und Verantwortung unterscheiden.',['Die schriftliche Fehlerdokumentation als Ausgangspunkt nehmen und die Beschäftigten nur dann befragen, wenn die Einträge einander widersprechen.','Fehlerberichte vertraulich an die Führungskraft richten und die Ergebnisse der Ursachenanalyse später im Team teilen.','Die erste Schilderung als Arbeitshypothese verwenden und eine Prozessänderung nach kurzer Beobachtung im laufenden Betrieb testen.'],'Offene Fragen schaffen eine belastbare Grundlage für Ursachenanalyse statt vorschneller Schuldzuweisung.','Beschäftigte melden Risiken eher frühzeitig und Fehlerursachen lassen sich besser beheben.'],\r\n ['kooperation','Vertrieb und Fertigung streiten über die Zusage eines Eiltermins. Wie kann die Zusammenarbeit verbessert werden?','Gemeinsame Prioritätskriterien und Eskalationsweg für Eilaufträge vereinbaren.',['Den Konflikt allein dem Vertrieb überlassen.','Alle Kundenanfragen pauschal als dringend behandeln.','Die Produktionsplanung ohne Rückmeldung ändern.'],'Gemeinsame Regeln verbinden Kundenanforderung und reale Kapazität.','Eilaufträge werden transparenter priorisiert und weniger andere Zusagen gefährdet.'],\r\n ['mitarbeitergespraech','Ein Mitarbeiter erreicht seine Qualitätsziele, berichtet aber von Überlastung. Wie sollte ein Führungsgespräch geführt werden?','Leistung und Belastung konkret besprechen und gemeinsam mögliche Ursachen sowie Unterstützung klären.',['Die Zielerreichung als Beweis fehlender Belastung ansehen.','Überlastung pauschal als mangelnde Motivation werten.','Alle Aufgaben ohne Rücksprache neu verteilen.'],'Ein Gespräch soll Fakten, persönliche Wahrnehmung und mögliche Maßnahmen erfassen.','Belastungsrisiken können früher bearbeitet werden, ohne Leistung oder Gesundheit gegeneinander auszuspielen.'],\r\n ['mitarbeitergespraech','Eine neue Mitarbeiterin fragt selten nach Hilfe und macht dadurch vermeidbare Fehler. Welche Gesprächsführung ist hilfreich?','Konkrete Beobachtung ansprechen, Erwartungen an Rückfragen klären und Unterstützung anbieten.',['Die Person als ungeeignet abstempeln.','Fehler stillschweigend selbst korrigieren.','Nur die Fehlerzahl ohne Gespräch dokumentieren.'],'Konkretes Feedback und klare Hilfswege machen Erwartungen handhabbar.','Die Beschäftigte kann Unsicherheiten früher melden und Fehler besser vermeiden.'],\r\n ['feedback','Ein Teamleiter muss eine wiederholt verspätete Auftragsdokumentation ansprechen. Welche Rückmeldung ist am konstruktivsten?','Zeitnah konkrete Beispiele, betriebliche Folgen und erwartetes Verhalten benennen.',['Die Persönlichkeit des Mitarbeiters pauschal abwerten.','Die Rückmeldung vor dem gesamten Team als Strafe geben.','Nur andeuten, dass „es besser werden muss“.'],'Sachliches und beobachtbares Feedback erleichtert eine klare Veränderung.','Dokumentationsqualität und Zusammenarbeit können verbessert werden, ohne die Person herabzusetzen.'],\r\n ['motivation','Ein Team erhält regelmäßig neue Prioritäten, ohne zu erfahren, warum frühere Aufgaben gestoppt wurden. Was sollte Führung tun?','Zielkonflikte und Prioritätswechsel transparent erläutern und Auswirkungen gemeinsam abstimmen.',['Weitere Prioritätswechsel ohne Begründung einführen.','Beschäftigte für liegengebliebene Aufgaben verantwortlich machen.','Kommunikation auf Endergebnisse beschränken.'],'Nachvollziehbare Entscheidungen geben Orientierung und erhöhen die Akzeptanz von Änderungen.','Das Team richtet Arbeit weniger häufig auf überholte Ziele aus.'],\r\n ['konfliktmanagement','Nach einer fehlerhaften Übergabe beschuldigen sich zwei Fachkräfte gegenseitig; die Schichtprotokolle liegen vor. Die Führung will beide Sichtweisen hören, bevor sie den Prozess ändert. Welche Maßnahme stellt sicher, dass beide Beschäftigten ihre Darstellung einbringen?','Getrennte Sachverhalte und Erwartungen aufnehmen und anschließend einen gemeinsamen Klärungstermin strukturieren.',['Die Verantwortung zunächst der Person mit der letzten Übergabe zuordnen und Prozessdetails anschließend nacherheben.','Die Übergabeprotokolle getrennt prüfen und daraus eine neue Regel ableiten, bevor beide Fachkräfte ihre Sicht gemeinsam erläutern.','Die Zusammenarbeit vorübergehend auf getrennte Aufgaben verteilen und den Übergabeprozess parallel in einem moderierten Termin klären.'],'Eine strukturierte Klärung trennt Prozessprobleme von persönlichen Vorwürfen.','Übergaberegeln und Arbeitsbeziehungen können gezielt verbessert werden.'],\r\n ['konfliktmanagement','Ein Mitarbeiter widerspricht in einer Besprechung deutlich der geplanten Arbeitsfolge. Wie sollte die Führungskraft reagieren?','Einwand und Begründung anhören und anhand gemeinsamer Kriterien prüfen.',['Widerspruch als Illoyalität werten.','Die Besprechung sofort beenden.','Den Einwand ohne Prüfung übernehmen und Entscheidung vermeiden.'],'Sachlicher Widerspruch kann Risiken sichtbar machen; die Entscheidung braucht dennoch Kriterien.','Fehlende Informationen kommen früh ans Licht und Entscheidungen werden besser begründet.'],\r\n ['mitarbeiterfoerderung','Eine Beschäftigte bearbeitet Routineaufträge sicher und möchte mehr Verantwortung übernehmen. Welche Fördermaßnahme ist geeignet?','Eine klar begrenzte Zusatzaufgabe mit Befugnis, Ziel und regelmäßiger Rückmeldung übertragen.',['Verantwortung ohne Befugnis hinzufügen.','Entwicklung bis zur nächsten Beförderungsrunde vertagen.','Alle Aufgaben gleichzeitig übertragen.'],'Abgestufte Verantwortung schafft Lerngelegenheiten bei kontrollierbarem Risiko.','Kompetenz und Eigenständigkeit können wachsen, während Ergebnisse begleitet werden.'],\r\n ['mitarbeiterfoerderung','Ein Mitarbeiter zeigt Stärke in der Fehleranalyse, aber wenig Erfahrung mit Kundenkommunikation. Wie kann die Führungskraft seine Entwicklung planen?','Kompetenzprofil und Zielrolle abgleichen und passende Übungs- oder Lerngelegenheiten vereinbaren.',['Nur die vorhandene Stärke weiter nutzen und Entwicklung ignorieren.','Den Mitarbeiter ohne Vorbereitung allein Kundengespräche führen lassen.','Ein allgemeines Seminar ohne Lernziel buchen.'],'Entwicklung setzt bei der Lücke zwischen vorhandener Fähigkeit und künftigem Aufgabenbedarf an.','Der Betrieb kann interne Talente auf neue Rollen vorbereiten und Übergaben absichern.'],\r\n ['ausbildung','Ein Betrieb möchte erstmals ausbilden; die benannte Fachkraft hat Berufserfahrung, aber ihre persönliche und fachliche Eignung sowie Ausbildereignung wurden noch nicht geprüft. Was muss vor Ausbildungsbeginn geklärt werden?','Persönliche und fachliche Eignung sowie verantwortliche geeignete Ausbilder nach BBiG prüfen.',['Ausbildung beginnen und Eignung erst bei der ersten Prüfung kontrollieren.','Berufserfahrung als Auswahlkriterium nutzen und die erforderlichen persönlichen und fachlichen Nachweise vor der Bestellung prüfen.','Auszubildende im Rahmen des Ausbildungsplans produktiv mitarbeiten lassen und die Betreuungskapazität der zuständigen Ausbilderin in der Schichtplanung berücksichtigen.'],'Das BBiG verlangt persönliche und fachliche Eignung; ein Betrieb muss geeignete Ausbildungsverantwortung sicherstellen.','Ordnungsgemäße Betreuung wird vor Beginn geklärt und Ausbildungsqualität nicht dem Zufall überlassen.'],\r\n ['ausbildung','Eine geeignete Ausbilderin ist bestellt, doch ihre Abwesenheit lässt Auszubildende regelmäßig ohne Anleitung. Was sollte die Ausbildungsleitung organisieren?','Verlässliche Vertretung und verantwortliche Vermittlung der Ausbildungsinhalte sicherstellen.',['Ausbildungsinhalte während Abwesenheit vollständig aussetzen.','Azubis ohne Unterstützung allein mit Aufträgen betrauen.','Die Verantwortung auf Kunden übertragen.'],'Ausbildung erfordert wirksame Betreuung und Vermittlung, nicht nur eine formale Benennung.','Lernfortschritt bleibt kontinuierlich und der Betrieb nutzt Ausbildungszeit sachgerecht.'],\r\n ['ausbildung','Der Betrieb möchte einen Auszubildenden dauerhaft für monotone Hilfsarbeiten einsetzen. Welche Führungsentscheidung entspricht dem Ausbildungszweck?','Aufgaben am Ausbildungsplan und Lernzielen ausrichten und geeignete Ausbildungsinhalte vermitteln.',['Hilfsarbeit als vollständigen Ausbildungserfolg behandeln.','Lernziele dem kurzfristigen Produktionsbedarf unterordnen.','Ausbildung ausschließlich durch Selbststudium ersetzen.'],'Berufsausbildung soll berufliche Handlungsfähigkeit vermitteln und braucht planmäßige Lerninhalte.','Der Betrieb entwickelt qualifizierten Nachwuchs statt lediglich kurzfristige Arbeitskapazität zu nutzen.'],\r\n ['projektmoderation','Ein Projektteam verliert sich in Details und kommt nicht zu einer Entscheidung über die neue Lagerordnung. Was kann die Moderation tun?','Entscheidungsfrage, Kriterien, offene Punkte und Verantwortlichkeit sichtbar strukturieren.',['Die Diskussion ohne Zusammenfassung weiterlaufen lassen.','Die Moderation selbst ohne Kriterien entscheiden lassen.','Alle Details aus dem Protokoll entfernen.'],'Eine klare Moderationsstruktur führt von Sachfragen zu einer nachvollziehbaren Entscheidung.','Das Projektteam nutzt Zeit fokussierter und kann die beschlossene Lösung umsetzen.'],\r\n ['praesentation','Eine Führungskraft präsentiert neue Qualitätsziele vor Mitarbeitenden, die direkt betroffen sind. Wie sollte sie die Präsentation gestalten?','Ziele, betriebliche Gründe, erwartete Änderungen und Rückfragemöglichkeit verständlich darstellen.',['Nur Kennzahlen zeigen, ohne ihre Bedeutung zu erklären.','Einwände aus Zeitgründen vollständig ausschließen.','Die Präsentation an externe Investoren statt das Team richten.'],'Adressatengerechte Präsentation verbindet Information mit Bedeutung für die Arbeit.','Beschäftigte verstehen eher, was sich ändert und wo sie Fragen einbringen können.'],\r\n ['motivation','Ein Mitarbeiter erhält regelmäßig nur dann Rückmeldung, wenn etwas schiefgeht. Welche Führungsmaßnahme verbessert die Rückmeldekultur?','Auch gute Beiträge und Fortschritte konkret anerkennen und Entwicklungshinweise regelmäßig geben.',['Positives Feedback als unnötig streichen.','Anerkennung pauschal und ohne Bezug verteilen.','Nur jährliche Beurteilungen zulassen.'],'Ausgewogenes zeitnahes Feedback macht wirksames Verhalten sichtbar und unterstützt Lernen.','Engagement und Orientierung können steigen, während Verbesserungsthemen weiterhin angesprochen werden.'],\r\n ['kommunikation','Eine sicherheitskritische Anweisung erreicht per E-Mail nicht alle Beschäftigten der Schicht. Wie lässt sich bei einer sicherheitskritischen Anweisung die Kenntnisnahme je betroffener Person nachvollziehbar absichern?','Anweisung über Schichtkommunikation vermitteln, Verständnis abfragen und die Kenntnisnahme jeder betroffenen Person dokumentieren.',['Den Versandnachweis der E-Mail dokumentieren und Rückfragen nur bei Beschäftigten mit späteren Verständnisschwierigkeiten einholen.','Die Schichtleitung mit der Weitergabe beauftragen und deren Rückmeldung als ausreichenden Nachweis für das Team werten.','Die mündliche Übergabe durch die Schichtleitung nutzen und ihre Sammelbestätigung als Nachweis der individuellen Kenntnisnahme dokumentieren.'],'Kritische Informationen brauchen zugängliche Vermittlung und eine nachvollziehbare Verständnisprüfung.','Die Wahrscheinlichkeit sinkt, dass Beschäftigte mit unterschiedlichen Informationsständen arbeiten.'],\r\n ['kooperation','Ein neuer Arbeitsablauf betrifft drei Abteilungen, aber jede optimiert nur ihre eigenen Kennzahlen. Wie sollte die Leitung Zusammenarbeit fördern?','Gemeinsames Prozessergebnis und bereichsübergreifende Verantwortlichkeit vereinbaren.',['Lokale Kennzahlen unverändert als alleinige Ziele nutzen.','Eine Abteilung für alle Ergebnisse verantwortlich machen.','Bereichsübergreifende Abstimmung abschaffen.'],'Ein gemeinsames Ergebnis hilft, lokale Optimierung zulasten des Gesamtprozesses zu vermeiden.','Übergabezeiten und Gesamtqualität können verbessert werden, statt Probleme weiterzureichen.'],\r\n ['mitarbeitergespraech','Eine Mitarbeiterin fällt wiederholt durch kurzfristige Abwesenheiten auf; Gründe sind der Führungskraft unbekannt. Wie sollte das Gespräch beginnen?','Sachlich auf konkrete Auswirkungen eingehen und die Perspektive der Mitarbeiterin anhören.',['Gesundheitliche Ursachen unterstellen und bewerten.','Sofort Sanktionen ankündigen, ohne Sachverhalt.','Abwesenheiten im Team öffentlich diskutieren.'],'Ein sachliches Gespräch klärt betriebliche Auswirkungen und ermöglicht angemessene nächste Schritte.','Planungsprobleme werden angesprochen, ohne private Informationen oder Vermutungen unangemessen zu behandeln.'],\r\n ['konfliktmanagement','Ein Teamkonflikt wird durch widersprüchliche Rollenbeschreibungen verstärkt. Welche nachhaltige Maßnahme sollte der Führung folgen lassen?','Aufgaben, Entscheidungsrechte und Schnittstellen schriftlich klären.',['Nur die beteiligten Personen zum besseren Verhalten auffordern.','Rollenbeschreibungen weiter unklar lassen.','Die Aufgaben ohne Abstimmung doppelt vergeben.'],'Die strukturelle Ursache muss neben der zwischenmenschlichen Klärung behoben werden.','Wiederkehrende Konflikte durch Zuständigkeitslücken werden unwahrscheinlicher.'],\r\n ['mitarbeiterfoerderung','Ein Beschäftigter macht Fortschritte bei der Maschinenprogrammierung, benötigt aber noch Kontrolle bei komplexen Teilen. Wie sollte die Führung delegieren?','Aufgabenschwierigkeit schrittweise erhöhen und Kontrollpunkte passend zur Kompetenz vereinbaren.',['Alle komplexen Aufgaben sofort vollständig übertragen.','Weiterhin jede Routinehandlung kontrollieren.','Entwicklung trotz sichtbaren Fortschritts stoppen.'],'Delegation sollte Kompetenzstand und Risiko berücksichtigen und schrittweise angepasst werden.','Lernfortschritt wird gefördert, während Qualität bei anspruchsvollen Aufgaben gesichert bleibt.'],\r\n ['ausbildung','Eine Ausbilderin soll Inhalte digital vermitteln, ohne gleichzeitig mit dem Auszubildenden am selben Ort zu sein. Was muss nach BBiG für mobiles digitales Ausbilden besonders gewährleistet sein?','Geeignete Inhalte und Technik sowie gleichwertige Vermittlungsqualität mit Erreichbarkeit, Lernsteuerung und Kontrolle sicherstellen.',['Digitale Übertragung allein als ausreichende Vermittlung ansehen.','Lernfortschritt während digitaler Phasen nicht kontrollieren.','Jede Ausbildungsaufgabe unabhängig von Eignung digital durchführen.'],'§ 28 Abs. 2 BBiG knüpft mobiles digitales Ausbilden an geeignete Bedingungen und gleichwertige Qualität.','Digitale Flexibilität bleibt mit erreichbarer Betreuung und überprüfbarem Lernfortschritt verbunden.'],\r\n ['projektmoderation','In einer Projektbesprechung schweigen Mitarbeitende, obwohl sie später Bedenken äußern. Welche Moderation kann Beteiligung verbessern?','Runde gezielter Beteiligung, stille Ideensammlung oder strukturierte Rückfragen anbieten.',['Bedenken nur von den ranghöchsten Personen einholen.','Schweigen als einstimmige Zustimmung protokollieren.','Kritische Beiträge unmittelbar bewerten und beenden.'],'Niedrigschwellige Beteiligungsformen können bislang unausgesprochene Informationen sichtbar machen.','Projektrisiken und Umsetzungswiderstände werden früher erkennbar.']\r\n]});\r\nareas[4].items.push(\r\n ['kooperation','Einkauf und Qualitätssicherung können sich nicht einigen, ob eine Charge freigegeben werden soll. Welche Zusammenarbeit ist zielführend?','Prüfkriterien, Befund und Risikofolgen gemeinsam anhand der vereinbarten Qualitätsanforderung bewerten.',['Die Entscheidung allein nach Liefertermin treffen.','Eine Abteilung ohne Prüfung überstimmen lassen.','Die Charge freigeben, damit der Konflikt endet.'],'Fachbereiche müssen anhand gemeinsamer Kriterien zu einer nachvollziehbaren Entscheidung kommen.','Die Freigabe schützt Qualität und Lieferfähigkeit, statt einen Zielkonflikt zu verdecken.'],\r\n ['mitarbeitergespraech','Eine Führungskraft möchte mit einem Beschäftigten über eine neue Aufgabenverteilung sprechen. Wie sollte sie das Gespräch vorbereiten?','Ziel, relevante Fakten, Gesprächsfragen und mögliche Unterstützungsbedarfe festlegen.',['Die endgültige Entscheidung verbergen und nur Kritik sammeln.','Gespräch ohne konkreten Anlass ansetzen.','Die neue Aufgabenverteilung bereits als unumstößlich darstellen.'],'Vorbereitung ermöglicht ein fokussiertes Gespräch und lässt Raum, Auswirkungen der Änderung zu verstehen.','Aufgabenwechsel werden realistischer geplant und Akzeptanzhürden werden früh erkennbar.'],\r\n ['feedback','Nach einer Verbesserungsidee fällt die Umsetzung im Alltag schwer. Welches Feedback unterstützt Lernen?','Beobachtete Umsetzung und Hindernisse konkret besprechen und nächsten Versuch vereinbaren.',['Nur die ursprüngliche Idee bewerten, ohne Umsetzung zu betrachten.','Misserfolg als mangelndes Engagement bezeichnen.','Die Idee ohne Rückmeldung verwerfen.'],'Feedback sollte Verhalten, Rahmenbedingungen und nächste Lernschritte verbinden.','Verbesserungsarbeit kann
