alquote?\",\n    \"options\": [\n      \"75 Prozent, weil die Fremdfinanzierung den Rest ausmacht\",\n      \"25 Prozent\",\n      \"4 Prozent, weil Eigenkapital durch Verbindlichkeiten geteilt wird\",\n      \"25 Prozent und damit bedeutet, dass ein Viertel der Bilanzsumme sofort liquide ist\"\n    ],\n    \"correctOption\": \"B\",\n    \"explanation\": \"50.000 Euro Eigenkapital geteilt durch 200.000 Euro Bilanzsumme ergeben 25 Prozent.\",\n    \"companyEffect\": \"Die Quote beschreibt den Eigenfinanzierungsanteil, aber nicht die sofort verfügbare Liquidität.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-equity-ratio\",\n    \"correctAnswer\": \"25 Prozent\"\n  },\n  {\n    \"id\": \"wbq-rw-019\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-inventory-turnover\",\n    \"scenario\": \"Der jährliche Materialverbrauch beträgt 120.000 Euro; der durchschnittliche Lagerbestand ist 20.000 Euro wert.\",\n    \"question\": \"Wie oft schlägt der Vorratsbestand nach dieser vereinfachten Kennzahl im Jahr um?\",\n    \"options\": [\n      \"Sechsmal\",\n      \"Drei Umschläge, wenn der Bestand nur zur Hälfte durchschnittlich genutzt wird\",\n      \"Sechsmal pro Monat, weil der Jahresverbrauch durch Bestand geteilt wird\",\n      \"20 Prozent, weil Bestand durch Jahresverbrauch gerechnet wird\"\n    ],\n    \"correctOption\": \"A\",\n    \"explanation\": \"Jahresverbrauch geteilt durch Durchschnittsbestand ergibt einen Lagerumschlag von sechs.\",\n    \"companyEffect\": \"Die Kennzahl unterstützt die Bestandssteuerung und muss zusammen mit Lieferfähigkeit und Fehlmengenrisiko bewertet werden.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-inventory-turnover\",\n    \"correctAnswer\": \"Sechsmal\"\n  },\n  {\n    \"id\": \"wbq-rw-020\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-receivables-days\",\n    \"scenario\": \"Der Jahresumsatz auf Ziel beträgt 365.000 Euro; die durchschnittlichen Forderungen liegen bei 30.000 Euro.\",\n    \"question\": \"Wie viele Forderungstage ergeben sich näherungsweise bei einer 365-Tage-Rechnung?\",\n    \"options\": [\n      \"30 Tage aus Umsatz geteilt durch Forderungen mal 365 berechnen\",\n      \"Rund 12 Tage, wenn nur ein Monat des Jahresumsatzes einbezogen wird\",\n      \"Rund 30 Tage und damit sind alle Rechnungen spätestens nach 30 Tagen beglichen\",\n      \"30 Tage\"\n    ],\n    \"correctOption\": \"D\",\n    \"explanation\": \"30.000 geteilt durch 365.000 und multipliziert mit 365 ergibt rund 30 Tage.\",\n    \"companyEffect\": \"Steigende Forderungstage können auf spätere Zahlungseingänge und eine längere Kapitalbindung hinweisen.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-receivables-days\",\n    \"correctAnswer\": \"30 Tage\"\n  },\n  {\n    \"id\": \"wbq-rw-021\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-accruals\",\n    \"scenario\": \"Der Betrieb verbraucht im Dezember Strom; die Rechnung geht erst im Januar ein.\",\n    \"question\": \"Welcher Periode ist der Dezemberverbrauch grundsätzlich als Aufwand zuzuordnen?\",\n    \"options\": [\n      \"Dem Zahlungsmonat unabhängig vom Zeitpunkt des Verbrauchs\",\n      \"Dem Dezember nur dann, wenn die Rechnung noch im selben Jahr bezahlt wird\",\n      \"Dem Dezember als Verbrauchsperiode\",\n      \"Dem Januar, weil der Rechnungseingang die Periode bestimmt\"\n    ],\n    \"correctOption\": \"C\",\n    \"explanation\": \"Bei periodengerechter Abgrenzung wird der Aufwand der Periode des Verbrauchs zugeordnet, vorbehaltlich der anzuwendenden Regeln.\",\n    \"companyEffect\": \"Ein korrekter Monatsabschluss macht Betriebsergebnisse vergleichbarer.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-accruals\",\n    \"correctAnswer\": \"Dem Dezember als Verbrauchsperiode\"\n  },\n  {\n    \"id\": \"wbq-rw-022\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-provision\",\n    \"scenario\": \"Zum Abschlussstichtag besteht eine wahrscheinliche Verpflichtung aus einem Rechtsstreit; die Höhe lässt sich angemessen schätzen.\",\n    \"question\": \"Welche Bilanzierungsfrage muss die Geschäftsführung prüfen?\",\n    \"options\": [\n      \"Den geschätzten Betrag als Aufwand und zusätzlich als Verbindlichkeit doppelt erfassen\",\n      \"Ob die Ansatzkriterien für eine Rückstellung erfüllt sind\",\n      \"Eine Rückstellung für jeden möglichen Rechtsstreit unabhängig von Wahrscheinlichkeit oder Schätzbarkeit\",\n      \"Eine Verbindlichkeit erst nach endgültigem Urteil prüfen\"\n    ],\n    \"correctOption\": \"B\",\n    \"explanation\": \"Bei einer bestehenden Verpflichtung mit wahrscheinlichem Abfluss und verlässlich schätzbarer Höhe kann eine Rückstellung erforderlich sein.\",\n    \"companyEffect\": \"Die frühzeitige Abbildung verhindert, dass Ergebnis und Risikolage zu günstig dargestellt werden.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-provision\",\n    \"correctAnswer\": \"Ob die Ansatzkriterien für eine Rückstellung erfüllt sind\"\n  },\n  {\n    \"id\": \"wbq-rw-023\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-bookkeeping\",\n    \"scenario\": \"Ein Kaufmann soll Geschäftsvorfälle samt Belegen nachvollziehbar dokumentieren.\",\n    \"question\": \"Welche Buchführungspraxis unterstützt eine verlässliche und prüfbare Aufzeichnung?\",\n    \"options\": [\n      \"Vollständige, geordnete und beleggestützte Erfassung\",\n      \"Nur die Bilanzsumme und den Kassenbestand am Jahresende aufzeichnen\",\n      \"Belege allein speichern, ohne Geschäftsvorfälle systematisch zu erfassen\",\n      \"Die Buchführung erst nach Aufforderung durch das Finanzamt beginnen\"\n    ],\n    \"correctOption\": \"A\",\n    \"explanation\": \"HGB § 238 verlangt Bücher, aus denen Geschäftsvorfälle und Unternehmenslage nach den Grundsätzen ordnungsmäßiger Buchführung ersichtlich sind.\",\n    \"companyEffect\": \"Nachvollziehbare Unterlagen erleichtern Jahresabschluss, Steuerarbeit und interne Kontrollen.\",\n    \"sourceRef\": \"LAW-HGB-238\",\n    \"sourceKind\": \"law\",\n    \"tooltipKey\": \"rw-bookkeeping\",\n    \"correctAnswer\": \"Vollständige, geordnete und beleggestützte Erfassung\"\n  },\n  {\n    \"id\": \"wbq-rw-024\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-investment-calculation\",\n    \"scenario\": \"Eine Maschine kostet 24.000 Euro und soll jährlich 8.000 Euro an zahlungswirksamen Betriebskosten einsparen.\",\n    \"question\": \"Wie lang ist die einfache Amortisationsdauer, wenn Abzinsung und weitere Zahlungsströme unberücksichtigt bleiben?\",\n    \"options\": [\n      \"2 Jahre, weil die jährliche Einsparung durch die Investition geteilt wird\",\n      \"3 Jahre, wobei der Zeitwert des Geldes bereits berücksichtigt ist\",\n      \"8 Jahre, weil die Einsparung als Anschaffungskosten gilt\",\n      \"Drei Jahre\"\n    ],\n    \"correctOption\": \"D\",\n    \"explanation\": \"24.000 Euro Investition geteilt durch 8.000 Euro jährliche Einsparung ergeben drei Jahre.\",\n    \"companyEffect\": \"Die einfache Amortisation ist ein grober Liquiditätsindikator und blendet Zeitwert sowie spätere Rückflüsse aus.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-investment-calculation\",\n    \"correctAnswer\": \"Drei Jahre\"\n  },\n  {\n    \"id\": \"wbq-rw-025\",\n    \"areaId\": \"wbq-rechnungswesen\",\n    \"competenceId\": \"rw-relevant-cost\",\n    \"scenario\": \"Für einen bereits fertiggestellten Prototyp fielen 2.000 Euro Entwicklungskosten an; dieser Betrag ist nicht mehr rückholbar.\",\n    \"question\": \"Wie sollten diese bereits entstandenen Kosten in eine neue Annahmeentscheidung einfließen?\",\n    \"options\": [\n      \"Den Prototyp nur dann weiterführen, wenn die früheren Entwicklungskosten zurückverdient werden\",\n      \"Die vergangenen Kosten auf alle künftigen Aufträge als variable Kosten verteilen\",\n      \"Als versunkene Kosten grundsätzlich nicht als künftig veränderbare Entscheidungskosten\",\n      \"Die bereits gezahlten 2.000 Euro als künftig vermeidbare Ausgabe behandeln\"\n    ],\n    \"correctOption\": \"C\",\n    \"explanation\": \"Versunkene Kosten sind bereits angefallen und ändern sich durch die aktuelle Wahl nicht.\",\n    \"companyEffect\": \"Die Entscheidung sollte sich auf künftige zusätzliche Erträge und Kosten konzentrieren.\",\n    \"sourceRef\": \"MAP-WBQ-RW\",\n    \"sourceKind\": \"competency-derivation\",\n    \"tooltipKey\": \"rw-relevant-cost\",\n    \"correctAnswer\": \"Als versunkene Kosten grundsätzlich nicht als künftig veränderbare Entscheidungskosten\"\n  },\n  {\n    \"id\": \"wbq-rt-001\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-contract-offer\",\n    \"scenario\": \"Ein Fertigungsbetrieb bietet 20 Halter zu 4.000 Euro an; das Angebot gilt ausdrücklich bis Freitag.\",\n    \"question\": \"Welche Aussage zu Bindung und Vertragsschluss passt zum befristeten Angebot?\",\n    \"options\": [\n      \"Der Vertrag ist bereits mit Zugang des Angebots geschlossen; eine Annahme dient nur noch als Nachweis\",\n      \"Die Frist bindet nur den Kunden; der Betrieb kann das Angebot bis Freitag frei widerrufen\",\n      \"Der Betrieb ist grundsätzlich bis Freitag an den Antrag gebunden; ein Vertrag entsteht erst bei rechtzeitiger Annahme durch den Kunden\",\n      \"Der Kunde kann auch nach Freitag annehmen, solange der Betrieb die Vorrichtung noch nicht anderweitig verkauft hat\"\n    ],\n    \"correctOption\": \"C\",\n    \"explanation\": \"Ein befristeter Antrag bindet den Anbieter grundsätzlich bis zum Fristablauf (§ 145, § 148 BGB). Der Vertrag kommt durch rechtzeitige Annahme zustande; eine verspätete Annahme gilt grundsätzlich als neuer Antrag (§ 150 Abs. 1 BGB).\",\n    \"companyEffect\": \"Eine klare Angebotsfrist schafft Planungssicherheit für Kapazität und Material; verspätete Annahmen sollten als neue Verhandlung behandelt werden.\",\n    \"sourceRef\": \"LAW-BGB-145;LAW-BGB-148;LAW-BGB-150\",\n    \"sourceKind\": \"law\",\n    \"tooltipKey\": \"rt-contract-offer\",\n    \"correctAnswer\": \"Der Betrieb ist grundsätzlich bis Freitag an den Antrag gebunden; ein Vertrag entsteht erst bei rechtzeitiger Annahme durch den Kunden\"\n  },\n  {\n    \"id\": \"wbq-rt-002\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-contract-acceptance\",\n    \"scenario\": \"Ein Kunde nimmt ein bis Freitag befristetes Angebot am Donnerstag ohne Änderungen an.\",\n    \"question\": \"Welche Folge hat eine rechtzeitige, inhaltlich übereinstimmende Annahme grundsätzlich?\",\n    \"options\": [\n      \"Der Vertrag kommt erst mit der ersten Zahlung des Kunden zustande\",\n      \"Der Vertrag kommt zustande\",\n      \"Eine Annahme nach Fristablauf bindet den Anbieter stets rückwirkend\",\n      \"Eine inhaltlich passende Antwort ist auch dann rechtzeitig, wenn sie nach Ablauf der Frist zugeht\"\n    ],\n    \"correctOption\": \"B\",\n    \"explanation\": \"Eine fristgerechte Annahme ohne Änderungen führt grundsätzlich zum Vertragsschluss.\",\n    \"companyEffect\": \"Der Betrieb sollte Kapazität und Material für die vereinbarten Pflichten einplanen.\",\n    \"sourceRef\": \"LAW-BGB-147\",\n    \"sourceKind\": \"law\",\n    \"tooltipKey\": \"rt-contract-acceptance\",\n    \"correctAnswer\": \"Der Vertrag kommt zustande\"\n  },\n  {\n    \"id\": \"wbq-rt-003\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-counteroffer\",\n    \"scenario\": \"Auf ein Angebot über 4.000 Euro antwortet der Kunde: „Einverstanden, wenn Sie in der halben Zeit liefern.“\",\n    \"question\": \"Wie ist diese Antwort nach den Regeln über die Annahme mit Änderungen grundsätzlich einzuordnen?\",\n    \"options\": [\n      \"Als Ablehnung verbunden mit einem neuen Antrag\",\n      \"Die Lieferzeit ist eine Nebenabrede; ihre Änderung lässt die Annahme unberührt\",\n      \"Eine geänderte Annahme gilt als Annahme, wenn der Kunde den Preis akzeptiert\",\n      \"Der ursprüngliche Antrag bleibt verbindlich, bis der Verkäufer der Änderung widerspricht\"\n    ],\n    \"correctOption\": \"A\",\n    \"explanation\": \"Eine Annahme unter Änderungen gilt grundsätzlich als Ablehnung verbunden mit einem neuen Antrag.\",\n    \"companyEffect\": \"Der Betrieb muss die geänderte Lieferfrist prüfen und die neuen Bedingungen ausdrücklich annehmen oder ablehnen.\",\n    \"sourceRef\": \"LAW-BGB-150\",\n    \"sourceKind\": \"law\",\n    \"tooltipKey\": \"rt-counteroffer\",\n    \"correctAnswer\": \"Als Ablehnung verbunden mit einem neuen Antrag\"\n  },\n  {\n    \"id\": \"wbq-rt-004\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-purchase-contract\",\n    \"scenario\": \"Ein Unternehmen verkauft einen gebrauchten Maschinenschraubstock an einen anderen Betrieb.\",\n    \"question\": \"Welche Hauptpflicht hat der Verkäufer aus dem Kaufvertrag?\",\n    \"options\": [\n      \"Der Käufer muss die Sache übernehmen, aber erst nach einer erfolgreichen Weiterveräußerung zahlen\",\n      \"Der Verkäufer muss neben der Sache immer auch eine Einweisung und spätere Wartung leisten\",\n      \"Mit Übergabe allein geht das Eigentum in jedem Fall über, auch wenn vereinbartes Eigentum vorbehalten bleibt\",\n      \"Die Sache übergeben und das Eigentum wie vereinbart verschaffen\"\n    ],\n    \"correctOption\": \"D\",\n    \"explanation\": \"Nach BGB § 433 muss der Verkäufer die Sache übergeben und Eigentum verschaffen; der Käufer muss zahlen und abnehmen.\",\n    \"companyEffect\": \"Artikel, Zustand, Preis und Übergabe sollten nachvollziehbar v \": \"wbq-rt-006\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-acceptance\",\n    \"scenario\": \"Der Besteller prüft ein fertiggestelltes Werk und erklärt, dass es im Wesentlichen der vereinbarten Beschaffenheit entspricht.\",\n    \"question\": \"Was bedeutet die Abnahme nach BGB § 640 grundsätzlich?\",\n    \"options\": [\n      \"Sie ist eine bloße Empfangsbestätigung und enthält keine Billigung des Werks\",\n      \"Der Besteller billigt das Werk als im Wesentlichen vertragsgemäß; wegen unwesentlicher Mängel darf er die Abnahme nicht verweigern\",\n      \"Sie beseitigt unabhängig von Kenntnis und Vorbehalt sämtliche Mängelrechte\",\n      \"Der Besteller muss erst abnehmen, wenn keinerlei geringfügige Abweichung mehr vorliegt\"\n    ],\n    \"correctOption\": \"B\",\n    \"explanation\": \"Die Abnahme ist mehr als die tatsächliche Entgegennahme: Der Besteller erklärt grundsätzlich die Billigung des vertragsgemäß hergestellten Werks. § 640 Abs. 1 erlaubt keine Verweigerung allein wegen unwesentlicher Mängel.\",\n    \"companyEffect\": \"Ein dokumentierter Abnahmestatus klärt den Leistungsabschluss; bei bekannten Mängeln sollte ein Vorbehalt ausdrücklich festgehalten werden.\",\n    \"sourceRef\": \"LAW-BGB-640\",\n    \"sourceKind\": \"law\",\n    \"tooltipKey\": \"rt-acceptance\",\n    \"correctAnswer\": \"Der Besteller billigt das Werk als im Wesentlichen vertragsgemäß; wegen unwesentlicher Mängel darf er die Abnahme nicht verweigern\"\n  },\n  {\n    \"id\": \"wbq-rt-007\",\n    \"areaId\": \"wbq-recht-und-steuern\",\n    \"competenceId\": \"rt-defect-remedy\",\n    \"scenario\": \"Ein gekauftes Bauteil weist einen Mangel auf, der bereits bei Übergabe bestand.\",\n    \"question\": \"Welche erste Prüfung ist für den Käufer sinnvoll?\",\n    \"options\": [\n      \"Vertrag, Mangel, Zeitpunkt und die gesetzlichen Rechte auf Nacherfüllung prüfen\",\n      \"Der Käufer kann bei jedem Mangel sofort den gesamten Kaufpreis mindern, ohne r Aufträge annehmen.','Die verspäteten Aufträge aus der Kennzahl entfernen.'],'Die Lieferplanung muss die vorgelagerten Materialzeiten berücksichtigen, damit Termine realistisch werden.','Weniger unrealistische Zusagen senken Nacharbeit in der Planung und stärken die Termintreue.'],\r\n ['planungsprozess','Die Geschäftsleitung erstellt für das nächste Jahr einen Absatzplan, obwohl ein Hauptkunde seinen Bedarf noch nicht bestätigt hat. Wie sollte die Annahme behandelt werden?','Den Plan mit klar gekennzeichneten Annahmen und Alternativszenarien erstellen.',['Den unbestätigten Bedarf als sicheren Auftrag buchen.','Den Hauptkunden vollständig aus jeder Planung ausschließen.','Die Planungsunsicherheit durch einen pauschalen Umsatzaufschlag verdecken.'],'Sichtbare Annahmen machen den Plan revidierbar, sobald bessere Informationen vorliegen.','Die Liquiditäts- und Personalplanung kann auf Nachfrageänderungen reagieren, statt auf Scheinsicherheit zu beruhen.'],\r\n ['planungsprozess','Ein Betrieb will den Auftragseingang steigern, doch seine CNC-Auslastung liegt bereits nahe der Grenze. Welche Planung verbindet Absatz und Leistungserstellung?','Absatz- und Kapazitätsplan gemeinsam abstimmen und Engpassalternativen bewerten.',['Den Vertrieb ausschließlich nach Anfragezahl vergüten.','Zusätzliche Aufträge unabhängig vom Liefertermin annehmen.','Die Fertigungskapazität im Plan als unbegrenzt ansetzen.'],'Absatzplanung ist nur erfüllbar, wenn verfügbare Maschinen- und Personalzeit mitbetrachtet werden.','Das Unternehmen kann profitable Aufträge auswählen, ohne eine unhaltbare Lieferpipeline aufzubauen.'],\r\n ['planungsprozess','Ein Materialpreis wird voraussichtlich stark steigen. Welche Planungsreaktion erlaubt eine robuste Entscheidung?','Auswirkungen auf Bedarf, Bestand, Liquidität und Angebotspreise in Varianten durchrechnen.',['Den Einkaufspreis dauerhaft auf dem aktuellen Stand einfrieren.','Unabhängig vom Bedarf sofort den gesamten Jahresverbrauch kaufen.','Die Preisänderung ausschließlich im Marketingplan behandeln.'],'Varianten zeigen, welche Kombination aus Beschaffung und Preisweitergabe tragbar ist.','Finanzbedarf und Angebotsmarge werden vor der Bindung von Kapital transparenter.'],\r\n ['statistik','Die Reklamationsquote steigt, während die absolute Zahl der Reklamationen gleich bleibt und die Auslieferungsmenge sinkt. Welche Deutung ist richtig?','Die Quote kann wegen des kleineren Bezugswerts steigen; absolute Werte und Bezugsgröße gemeinsam prüfen.',['Eine steigende Quote beweist, dass mehr Fehler aufgetreten sind.','Die Quote ist mit der Auslieferungsmenge nicht verbunden.','Die Reklamationen sollten aus der Statistik entfernt werden.'],'Eine relative Kennzahl kann sich durch Zähler oder Nenner verändern.','Die Leitung vermeidet eine falsche Ursachenmaßnahme und untersucht die Fehler je gelieferter Einheit.'],\r\n ['statistik','Die Geschäftsführung vergleicht Krankenstände zweier Monate mit unterschiedlicher Beschäftigtenzahl. Welche Kennzahl ist für den Vergleich geeigneter?','Eine einheitlich definierte Fehlzeitenquote mit vergleichbarer Bezugsgröße berechnen.',['Nur die absolute Zahl der Fehltage vergleichen.','Monatswerte addieren, ohne Beschäftigtenzahl zu berücksichtigen.','Fehlzeiten nachträglich den Urlaubstagen zuschlagen.'],'Eine vergleichbare Quote berücksichtigt die unterschiedliche Größe der Belegschaft.','Personalentscheidungen stützen sich weniger auf Verzerrungen durch unterschiedliche Beschäftigtenzahlen.'],\r\n ['statistik','Ein Monatsbericht zeigt, dass der durchschnittliche Auftragswert gestiegen ist. Gleichzeitig gibt es weniger Aufträge. Welche Ergänzung hilft bei der Interpretation?','Auftragszahl, Gesamtumsatz und Auftragsmix zusätzlich betrachten.',['Den Mittelwert als Beweis für höheres Gesamtgeschäft werten.','Nur den größten Auftrag für den Vergleich verwenden.','Die Zahl der Aufträge aus dem Bericht entfernen.'],'Der Mittelwert allein sagt nichts darüber, wie sich Gesamtvolumen und Zusammensetzung verändert haben.','Vertriebs- und Kapazitätsplanung erhalten ein vollständigeres Bild der Nachfrage.'],\r\n ['statistik','Die Liefertermintreue liegt im Quartal bei 92 Prozent. Die Geschäftsleitung möchte wissen, ob sich der Prozess verbessert hat. Was sollte verglichen werden?','Mehrere vergleichbare Perioden und die Definition des zugesagten Termins heranziehen.',['Nur den besten Monat mit dem Quartalswert vergleichen.','Die Kennzahl um verspätete Aufträge bereinigen.','Liefertermintreue mit Umsatzhöhe gleichsetzen.'],'Trend und einheitliche Messdefinition sind nötig, um eine Veränderung belastbar zu beurteilen.','Das Team kann erkennen, ob Maßnahmen dauerhaft wirken oder nur ein einzelner Monat günstig war.'],\r\n ['statistik','Eine Auswertung weist ungewöhnlich lange Durchlaufzeiten für wenige Aufträge aus. Wie sollte der Mittelwert ergänzt werden?','Verteilung und Ausreißer prüfen und zusätzlich Median oder Häufigkeiten betrachten.',['Den längsten Auftrag aus allen Auswertungen löschen.','Nur den Mittelwert ohne Fallzahlen veröffentlichen.','Die Bearbeitungszeiten pauschal runden.'],'Eine Verteilung zeigt, ob wenige Extremfälle den Mittelwert prägen.','Engpassaufträge werden sichtbar, ohne den Normalfall oder Ausnahmen zu verschleiern.'],\r\n ['organisation','Angebote bleiben liegen, weil Vertrieb und Kalkulation nicht wissen, wer die technische Prüfung anstößt. Welche Organisationsmaßnahme ist passend?','Schnittstellen, Auslöser und Verantwortlichkeit im Angebotsprozess festlegen.',['Eine zusätzliche Freigabestufe ohne Zuständigkeit schaffen.','Die Aufgabe beiden Bereichen gleichzeitig und ohne Abstimmung übertragen.','Die technische Prüfung aus dem Prozess streichen.'],'Ein definierter Prozessübergang verhindert, dass die Aufgabe zwischen Bereichen verloren geht.','Angebote können zügiger und mit nachvollziehbarer technischer Prüfung erstellt werden.'],\r\n ['organisation','Die Geschäftsführung möchte Entscheidungen beschleunigen, aber jede Kleinigkeit muss von ihr freigegeben werden. Was ist eine sinnvolle Lösung?','Entscheidungsspielräume nach Betrag oder Risiko delegieren und Eskalationsgrenzen bestimmen.',['Alle Kontrollen ersatzlos abschaffen.','Jede Entscheidung zusätzlich an die Geschäftsführung melden.','Befugnisse informell vergeben, ohne sie mitzuteilen.'],'Abgegrenzte Befugnisse entlasten die Leitung und erhalten Kontrollen bei relevanten Risiken.','Routinefälle werden schneller bearbeitet; wesentliche Verpflichtungen bleiben eskalierbar.'],\r\n ['organisation','Eine Werkstatt wächst, und Mitarbeitende erhalten widersprüchliche Prioritäten von zwei Vorgesetzten. Was sollte geklärt werden?','Weisungswege und Priorisierungsverantwortung für die betroffenen Aufgaben festlegen.',['Eine dritte Weisungsebene ergänzen.','Mitarbeitende selbst für jeden Zielkonflikt haftbar machen.','Prioritäten täglich ohne Abstimmung wechseln.'],'Eindeutige Weisungswege reduzieren Doppelarbeit und widersprüchliche Arbeitsaufträge.','Die Beschäftigten können ihre Zeit besser auf verbindliche Auftragsziele ausrichten.'],\r\n ['organisation','Ein Betrieb führt eine neue Software ein, aber niemand ist für Stammdatenqualität zuständig. Welche organisatorische Lücke besteht?','Verantwortung und Pflegeprozess für die Daten festlegen.',['Die Software durch mehr Tabellen ergänzen.','Datenfehler ausschließlich beim Anbieter verorten.','Stammdaten ohne Prüfregeln allen Nutzenden überlassen.'],'Technische Werkzeuge ersetzen keine klare Datenverantwortung.','Verlässliche Stammdaten reduzieren Planungsfehler und falsche Auswertungen.'],\r\n ['organisation','Im Urlaub einer Schlüsselperson kann niemand Lieferantenbestellungen freigeben. Welche organisatorische Vorsorge ist angemessen?','Vertretung, Zugriff und Übergabe für kritische Aufgaben verbindlich regeln.',['Bestellungen während des Urlaubs grundsätzlich aussetzen.','Zugänge informell weitergeben.','Die Aufgabe ohne Berechtigung jeder Person öffnen.'],'Eine geregelte Vertretung erhält Handlungsfähigkeit und kontrollierten Zugriff.','Materialversorgung bleibt gesichert, ohne interne Kontrollen zu umgehen.'],\r\n ['personalentwicklung','Neue Messgeräte werden eingeführt; nur zwei Beschäftigte kennen deren Bedienung. Welche Personalentwicklungsmaßnahme reduziert die Abhängigkeit?','Weitere Mitarbeitende bedarfsgerecht qualifizieren und praktische Anwendung nachhalten.',['Die Messgeräte nur von den zwei bisherigen Fachkräften bedienen lassen.','Eine allgemeine Schulung ohne Bezug zum Gerät buchen.','Die Bedienungsanleitung als Qualifikationsnachweis behandeln.'],'Gezielte Qualifizierung baut die Kompetenzlücke auf und Transferkontrolle prüft die Anwendung.','Ausfälle einzelner Schlüsselpersonen blockieren die Qualitätsprüfung weniger leicht.'],\r\n ['personalentwicklung','Ein Mitarbeiter möchte eine anspruchsvollere Aufgabe übernehmen, zeigt aber noch Unsicherheit bei der Dokumentation. Wie sollte die Führungskraft fördern?','Lernziel, Übungsaufgaben und begleitendes Feedback vereinbaren.',['Die Aufgabe sofort vollständig übertragen und Unterstützung verweigern.','Entwicklung ablehnen, ohne Kompetenzbedarf zu klären.','Nur die Fehlerquote bewerten und kein Lernziel nennen.'],'Ein abgestufter Entwicklungsplan verbindet Herausforderung und notwendige Unterstützung.','Der Betrieb kann Kompetenzen schrittweise erweitern und Qualitätsrisiken begrenzen.'],\r\n ['personalentwicklung','Nach einer Schulung ändern sich die Fehlerzahlen nicht. Was sollte die Leitung prüfen, bevor sie weitere Kurse bucht?','Ob Lerninhalte angewendet werden können und Arbeitsbedingungen den Transfer erlauben.',['Die Schulung automatisch als wirkungslos einstufen.','Alle Beschäftigten unabhängig von Bedarf erneut anmelden.','Die Fehlerzahlen als Lernnachweis verwenden.'],'Lernerfolg hängt auch von Gelegenheit, Prozess und Unterstützung am Arbeitsplatz ab.','Weiterbildungsbudget kann gezielter eingesetzt und Prozesshindernisse können behoben werden.'],\r\n ['personalentwicklung','Ein Betrieb verliert wiederholt Wissen, wenn erfahrene Beschäftigte ausscheiden. Welche Maßnahme unterstützt Wissensmanagement?','Kritisches Erfahrungswissen strukturiert dokumentieren und Übergaben organisieren.',['Wissen ausschließlich bei einzelnen Personen belassen.','Alle Arbeitsanweisungen ohne Prüfung veröffentlichen.','Nur die Dauer der Betriebszugehörigkeit erfassen.'],'Dokumentation und Austausch machen wichtiges Wissen für Nachfolge und Einarbeitung nutzbar.','Produktionsabläufe hängen weniger von individuellem Gedächtnis ab.'],\r\n ['personalentwicklung','Eine neue Fachkraft soll eingearbeitet werden, aber jede Schicht erklärt die Abläufe anders. Was hilft?','Einen abgestimmten Einarbeitungsplan mit Lernschritten und Ansprechpersonen erstellen.',['Die Fachkraft ohne Einweisung sofort allein einsetzen.','Alle Details ausschließlich mündlich weitergeben.','Die Einarbeitung nach dem ersten Arbeitstag beenden.'],'Ein strukturierter Plan schafft eine konsistente Lernfolge und erkennbare Verantwortlichkeit.','Die neue Person erreicht schneller einen verlässlichen Arbeitsstand und verursacht weniger vermeidbare Fehler.'],\r\n ['entscheidungstechnik','Zwei Lieferanten bieten vergleichbare Qualität, aber unterschiedliche Preise und Lieferzeiten. Wie lässt sich die Auswahl nachvollziehbar machen?','Kriterien gewichten und Angebote anhand derselben Bewertungsmaßstäbe vergleichen.',['Den günstigsten Preis automatisch als bestes Angebot wählen.','Nach persönlicher Bekanntheit entscheiden, ohne Kriterien festzulegen.','Preise und Lieferzeiten addieren, ohne Bedeutung festzulegen.'],'Ein gewichteter Kriterienvergleich macht Zielprioritäten und Abwägungen transparent.','Die Beschaffungsentscheidung lässt sich gegenüber Leitung und Produktion begründen.'],\r\n ['entscheidungstechnik','Ein Team diskutiert lange über Ursachen eines Maschinenstillstands, obwohl die wichtigsten Fakten fehlen. Welche Technik bringt die Entscheidung voran?','Fehlende Informationen, Hypothesen und Prüfschritte getrennt erfassen.',['Die erste Vermutung als Ursache festschreiben.','Mehrheitsabstimmung über ungeprüfte Ursachen durchführen.','Die Diskussion abbrechen und denselben Ablauf wiederholen.'],'Die Trennung von Fakten und Annahmen lenkt die Analyse auf überprüfbare Ursachen.','Die Instandhaltung kann wirksamer priorisieren und wiederholte Stillstände vermeiden.'],\r\n ['zeitmanagement','Eine Führungskraft bearbeitet ständig dringende Rückfragen und verschiebt wichtige Personalplanung. Welche Methode hilft bei der Priorisierung?','Aufgaben nach Wichtigkeit und Dringlichkeit ordnen und Zeitblöcke für wichtige Arbeit schützen.',['Jede eingehende Anfrage sofort unterbrechen lassen.','Nur die kürzesten Aufgaben bearbeiten.','Alle Aufgaben gleichzeitig beginnen.'],'Priorisierung schützt wichtige, nicht unmittelbar dringende Führungsaufgaben vor dauerhaftem Aufschub.','Personalengpässe werden vorausschauender bearbeitet statt erst im Krisenmodus.'],\r\n ['kreativitaet','Ein Betrieb sucht Ideen zur Verringerung von Rüstzeiten; in Besprechungen sprechen meist dieselben Personen. Welche Moderation ist hilfreich?','Zunächst Ideen unabhängig sammeln und danach gemeinsam anhand vereinbarter Kriterien bewerten.',['Jede Idee während der Sammlung sofort kritisieren.','Die erste Idee ohne Vergleich übernehmen.','Nur Führungskräfte Vorschläge entwickeln lassen.'],'Getrennte Ideen- und Bewertungsphasen verringern vorschnelle Ablehnung und erweitern Beteiligung.','Mehr praktikable Verbesserungsoptionen können geprüft werden, bevor Ressourcen gebunden werden.'],\r\n ['wissensmanagement','Eine aktualisierte Arbeitsanweisung wird in einem persönlichen Ordner gespeichert und erreicht die Schichten nicht. Was ist die passende Verbesserung?','Eine zugängliche, versionierte Ablage mit Verantwortlichkeit für Veröffentlichung einrichten.',['Mehrere unkontrollierte Kopien per E-Mail verteilen.','Alte Fassungen im Umlauf lassen, um Auswahl zu ermöglichen.','Die Änderung nur in einer Besprechung erwähnen.'],'Eine gelenkte Version stellt sicher, dass Mitarbeitende dieselbe gültige Information nutzen.','Fehler durch veraltete Arbeitsweisen und widersprüchliche Dokumente werden seltener.']\r\n ]}\r\n];\r\nareas[0].items.push(\r\n ['decisiontechnique','Ein Investitionsgremium bewertet eine neue Drehmaschine; die Mitglieder verwenden unterschiedliche Annahmen zu Auslastung und Nutzungsdauer. Wie wird der Vergleich belastbar?','Gemeinsame Annahmen und einen einheitlichen Betrachtungszeitraum festlegen, dann neu vergleichen.',['Die Bewertungen mitteln, obwohl sie verschiedene Nutzungsdauern enthalten.','Nur die höchste Einzelbewertung übernehmen.','Die Annahmen nachträglich so ändern, dass die bevorzugte Anlage gewinnt.'],'Unterschiedliche Rechengrundlagen machen Alternativen nicht vergleichbar.','Die Leitung erhält eine nachvollziehbare Entscheidungsgrundlage statt eines scheinbar präzisen, aber verzerrten Rankings.'],\r\n    ['analyse','Der Auftragseingang steigt, zugleich sinkt der Deckungsbeitrag je Auftrag. Welche Auswertung zeigt, ob sich der Deckungsbeitrag je Segment durch veränderten Auftragsmix oder niedrigere Verkaufspreise verändert hat?','Auftragsmix, Preisnachlässe und variable Kosten nach Segment untersuchen.',['Auftragseingang nach Stückzahl aufschlüsseln und die durchschnittliche Marge als Maßstab für alle Segmente verwenden.','Nur die Gesamtkosten betrachten und die Erlösseite ignorieren.','Personalaufwand je Auftrag auf Veränderungen prüfen und Preis- sowie Materialeffekte anschließend nach Produktgruppe vergleichen.'],'Mehr Volumen kann aus margenschwachen Aufträgen stammen; die Zusammensetzung muss geprüft werden.','Der Vertrieb kann seine Angebotsstrategie an profitablen Segmenten ausrichten.'],\r\n ['risikomanagement','Ein Mitarbeiter kennt allein den Zugang zum Prüfmittelarchiv. Welche Maßnahme verbessert die betriebliche Resilienz?','Zugriff und Vertretungswissen für berechtigte Personen kontrolliert aufbauen.',['Das Passwort unkontrolliert an alle Beschäftigten verteilen.','Den Zugang aus Sicherheitsgründen dauerhaft sperren.','Die Abhängigkeit bis zum Ausfall nicht dokumentieren.'],'Kontrollierte Vertretung verringert Ausfallabhängigkeit und erhält angemessene Zugriffssteuerung.','Qualitätsnachweise bleiben auch bei Abwesenheit verfügbar.'],\r\n ['zielsystem','Die Fertigung wird nach Auslastung bewertet und produziert dadurch Teile ohne kurzfristigen Bedarf. Welche Steuerungsänderung ist sinnvoll?','Auslastung mit Bestand, Lieferfähigkeit und tatsächlichem Bedarf gemeinsam bewerten.',['Auslastung als einziges Leistungsziel beibehalten.','Zusätzliche Produktion grundsätzlich als Verkaufserfolg verbuchen.','Bestände aus der Zielbewertung ausschließen.'],'Einzelkennzahlen können unerwünschte Anreize setzen; ergänzende Ziele zeigen Nebenwirkungen.','Unnötige Lagerbestände und gebundenes Kapital können sinken, ohne die Lieferfähigkeit zu vernachlässigen.'],\r\n ['zielsystem','Ein Vertriebsziel belohnt nur den Umsatz; Mitarbeitende geben regelmäßig hohe Rabatte. Welche Anpassung adressiert den Fehlanreiz?','Umsatzziel um Margen- und Qualitätskriterien ergänzen.',['Umsatzziel erhöhen, ohne Nachlassverhalten zu prüfen.','Rabatte nachträglich als Marketingumsatz verbuchen.','Die Wirkung des Ziels erst nach mehreren Jahren beurteilen.'],'Einseitige Umsatzanreize können Erlös auf Kosten der Marge fördern.','Angebote werden stärker auf tragfähige Aufträge und Kundennutzen ausgerichtet.'],\r\n ['organisation','Kundenreklamationen werden an den Vertrieb gemeldet, aber nicht an Qualität oder Fertigung weitergegeben. Welche Struktur ist erforderlich?','Einen verbindlichen Reklamationsprozess mit Weiterleitung, Verantwortlichen und Rückmeldung einrichten.',['Reklamationen ausschließlich im Vertrieb archivieren.','Jede Abteilung eigene, nicht abgestimmte Listen führen lassen.','Rückmeldungen an den Kunden vor Ursachenprüfung endgültig schließen.'],'Ein klarer Informationsweg verbindet Kundensignal, Ursachenbearbeitung und Korrektur.','Wiederkehrende Fehler werden eher systemisch behoben und Kunden erhalten verlässlichere Antworten.'],\r\n ['wissensmanagement','Eine wichtige Prozessänderung wird nur in einer Chatnachricht festgehalten, die später nicht auffindbar ist. Wie sollte Wissen gesichert werden?','Die freigegebene Änderung in der gelenkten Prozessdokumentation mit Datum und Version ablegen.',['Die Nachricht mit immer neuen Antworten verlängern.','Die Änderung als Erfahrungswissen der schreibenden Person belassen.','Alle Chatverläufe ohne Ordnung exportieren.'],'Nachvollziehbare Ablage und Versionierung machen Prozesswissen dauerhaft auffindbar.','Schichtteams können den aktuellen Standard konsistent anwenden.'],\r\n ['zeitmanagement','Eine Projektleitung erhält viele parallele Aufgaben; mehrere Abhängigkeiten blockieren Folgearbeiten. Welche Planungshilfe ist angemessen?','Arbeitspakete, Abhängigkeiten, Verantwortliche und kritischen Zeitpfad sichtbar planen.',['Alle Aufgaben mit identischer Dauer parallel terminieren.','Nur ein Enddatum kommunizieren.','Die Abhängigkeiten den Mitarbeitenden zur spontanen Lösung überlassen.'],'Abhängigkeiten bestimmen, welche Verzögerungen den Endtermin tatsächlich gefährden.','Ressourcen können auf zeitkritische Schritte konzentriert und Verzögerungen früh eskaliert werden.'],\r\n ['projektmoderation','Bei einem bereichsübergreifenden Projekt reden Fertigung und Vertrieb aneinander vorbei. Welche Moderationsfrage hilft, das gemeinsame Ziel zu klären?','Welche messbare Veränderung soll der Kunde nach Umsetzung wahrnehmen?',['Welcher Bereich hat in der Vergangenheit am häufigsten Fehler gemacht?','Wer kann das Projekt ohne weitere Abstimmung freigeben?','Wie lässt sich die Besprechung möglichst schnell beenden?'],'Eine gemeinsame Kundensicht richtet unterschiedliche Fachperspektiven auf ein überprüfbares Projektergebnis aus.','Der Projektumfang wird stärker am Nutzen ausgerichtet und Bereichskonflikte werden sachlicher verhandelbar.'],\r\n ['statistik','Die Ausschussquote eines Produkts steigt nach einer Änderung des Prüfverfahrens. Was ist vor einem Ursachenurteil zu prüfen?','Ob Definition, Stichprobe und Erfassungsmethode vor und nach der Änderung vergleichbar sind.',['Die neue Quote als Beweis für eine schlechtere Fertigung werten.','Die alte Messreihe löschen, weil das Verfahren geändert wurde.','Nur die Zahl geprüfter Teile betrachten.'],'Ein Methodenwechsel kann eine Kennzahlenänderung verursachen, ohne dass sich die Prozessqualität verändert hat.','Die Leitung vermeidet unnötige Prozessänderungen und trennt Mess- von Fertigungseffekten.'],\r\n ['analyse','Ein Unternehmen verfügt über hohe Auslastung, aber niedrige Kundenzufriedenheit. Welche Analyse verbindet Prozess- und Marktsicht?','Lieferzeiten und Qualitätsdaten mit Kundenrückmeldungen sowie Prozessursachen verknüpfen.',['Auslastung als ausreichenden Erfolgsnachweis verwenden.','Kundenfeedback nur nach Umsatzhöhe sortieren.','Die Produktionsmenge erhöhen, um die Zufriedenheit zu verbessern.'],'Hohe Auslastung erklärt nicht, ob Kunden ihre vereinbarte Leistung erhalten.','Verbesserungen können an tatsächlichen Termintreue- oder Qualitätsproblemen ansetzen.'],\r\n ['personalentwicklung','Ein erfahrener Beschäftigter soll eine neue Teamleitungsaufgabe übernehmen, hat aber wenig Erfahrung mit Mitarbeitergesprächen. Was ist eine geeignete Förderung?','Gesprächskompetenz gezielt entwickeln und die ersten Gespräche reflektiert begleiten.',['Die Beförderung wegen fehlender Routine grundsätzlich ausschließen.','Alle schwierigen Personalgespräche an die Geschäftsführung abgeben.','Die neue Rolle ohne Vorbereitung beginnen lassen.'],'Die Entwicklungsmaßnahme schließt eine rollenspezifische Kompetenzlücke und bietet Transferunterstützung.','Die neue Leitung kann Konflikte und Leistungsthemen früher konstruktiv bearbeiten.'],\r\n ['entscheidungstechnik','Ein Team muss zwischen Eigenfertigung und Fremdbezug entscheiden; mehrere Kriterien sind nicht in Geld messbar. Welche Methode passt?','Nutzwertanalyse mit transparenten Kriterien, Gewichtungen und Sensitivitätsprüfung verwenden.',['Nur den Einkaufspreis vergleichen.','Alle Kriterien gleichsetzen, ohne ihre Bedeutung zu diskutieren.','Die nicht-monetären Kriterien aus der Entscheidung entfernen.'],'Eine Nutzwertanalyse kann qualitative Kriterien strukturiert einbeziehen; Gewichte bleiben prüfbare Annahmen.','Die Entscheidung berücksichtigt neben Kosten auch Qualität, Abhängigkeit und Know-how.'],\r\n ['organisation','Ein Unternehmen hat keinen klaren Eskalationsweg, wenn ein Lieferant eine kritische Zusage nicht einhält. Welche Organisationsregel hilft?','Auslöser, zuständige Rolle und Eskalationsstufe für kritische Lieferabweichungen bestimmen.',['Jede Person soll parallel beim Lieferanten reklamieren.','Eskalation erst nach Produktionsstillstand zulassen.','Lieferabweichungen ausschließlich in der Jahresbewertung behandeln.'],'Ein definierter Eskalationsweg ermöglicht rechtzeitige koordinierte Reaktion.','Engpässe können früher mit Einkauf und Fertigung bearbeitet werden.'],\r\n ['zielsystem','Die Geschäftsführung will Nachhaltigkeit verbessern, hat aber nur eine allgemeine Absicht formuliert. Was macht das Ziel steuerbar?','Messgröße, Ausgangswert, Zieltermin und verantwortliche Rolle festlegen.',['Ein ambitioniertes Ziel ohne Kennzahl veröffentlichen.','Nur die Zahl der Nachhaltigkeitsbesprechungen messen.','Den Zieltermin aus dem Bericht weglassen.'],'Messbare Zielbestandteile ermöglichen Fortschrittskontrolle und Verantwortlichkeit.','Ressourcen können auf konkrete Verbrauchs- oder Prozessverbesserungen gerichtet werden.'],\r\n ['statistik','Die Zahl der Arbeitsunfälle ist im Quartal null. Welche Aussage lässt sich daraus sicher ableiten?','Nur, dass in diesem Zeitraum keine erfassten Unfälle auftraten; das Risiko ist dadurch nicht ausgeschlossen.',['Der Betrieb ist dauerhaft vollständig sicher.','Präventionsmaßnahmen können eingestellt werden.','Beinaheunfälle sind deshalb statistisch irrelevant.'],'Seltene Ereignisse erlauben keine Garantie über zukünftige Risiken oder Meldequalität.','Der Betrieb setzt Prävention fort und berücksichtigt auch Gefährdungen sowie Beinaheereignisse.'],\r\n ['projektplanung','Eine Prozessverbesserung soll gleichzeitig in Einkauf, Fertigung und Versand eingeführt werden. Was gehört in einen umsetzbaren Projektauftrag?','Ziel, Umfang, Verantwortliche, Meilensteine und Erfolgskriterien benennen.',['Nur ein Budgetlimit festlegen.','Alle Ideen während der Umsetzung automatisch zum Projektumfang machen.','Die Erfolgskriterien erst nach Abschluss auswählen.'],'Ein klarer Auftrag begrenzt Umfang und macht Fortschritt sowie Ergebnis überprüfbar.','Bereiche können abgestimmt beitragen, ohne dass Zeit oder Ressourcen unkontrolliert ausufern.'],\r\n ['entscheidungstechnik','Zwei Handlungsoptionen hängen stark von einem unsicheren Absatzwachstum ab. Wie kann die Leitung die Robustheit der Wahl prüfen?','Sensitivitätsanalyse für die entscheidenden Annahmen durchführen.',['Nur den optimistischen Fall rechnen.','Die Unsicherheit durch einen Mittelwert ersetzen und nicht dokumentieren.','Nach der ersten Rechnung keine Parameter mehr verändern.'],'Die Sensitivitätsanalyse zeigt, ab wann sich die Vorteilhaftigkeit einer Option ändert.','Die Geschäftsführung erkennt, welche Annahmen entscheidungskritisch sind und überwacht sie gezielt.'],\r\n ['wissensmanagement','Nach einer Reklamation wurde eine hilfreiche Korrekturmaßnahme gefunden, die andere Teams nicht kennen. Wie lässt sich organisationales Lernen sichern?','Erkenntnis, Anwendungsbereich und geänderten Standard dokumentieren und betroffene Teams informieren.',['Nur den Einzelfall schließen.','Die Maßnahme ohne Prüfung auf jeden Prozess übertragen.','Die Erfahrung ausschließlich im persönlichen Gedächtnis speichern.'],'Wissenstransfer macht eine geprüfte Erkenntnis zugänglich, ohne ihre Gültigkeit ungeprüft zu verallgemeinern.','Ähnliche Fehler können vermieden werden und Verbesserungen werden über Bereiche hinweg nutzbar.'],\r\n ['zeitmanagement','Eine Besprechung endet regelmäßig ohne klare Aufgaben und Termine. Welche Maßnahme verbessert die Umsetzung?','Zum Abschluss Entscheidungen, Aufgabenverantwortliche und Fristen protokollieren.',['Die Besprechungszeit verlängern, ohne Ergebnisse festzuhalten.','Das Protokoll nur als Teilnehmerliste führen.','Aufgaben offenlassen, damit mehr Flexibilität bleibt.'],'Verbindliche Ergebnisse machen die Umsetzung nachverfolgbar.','Beschlüsse gehen seltener verloren und Folgearbeit kann gezielt eingeplant werden.'],\r\n ['statistik','Ein Betrieb meldet eine hohe durchschnittliche Mitarbeiterauslastung. Was muss bei der Interpretation beachtet werden?','Überlastung, Wartezeiten und Verteilung zwischen Personen zusätzlich untersuchen.',['Den Durchschnitt als Beweis für gleichmäßige Auslastung ansehen.','Leerlaufzeiten aus der Datenerhebung entfernen.','Nur die produktivste Person betrachten.'],'Ein Durchschnitt kann ungleiche Verteilung und lokale Engpässe verdecken.','Kapazitätsplanung kann Belastung besser ausgleichen und Ausfallrisiken erkennen.'],\r\n ['risikomanagement','Ein Cybervorfall legt die Produktionsplanung kurzfristig lahm. Welche organisatorische Vorsorge wäre besonders relevant?','Wiederanlaufverfahren, Verantwortlichkeiten und gesicherte aktuelle Planungsdaten vorbereiten.',['Alle Systeme ohne Wiederherstellungsprüfung sichern.','Notfallentscheidungen erst nach Eintritt des Vorfalls verteilen.','Die Planung ausschließlich auf Papier doppelt führen, ohne Aktualisierung.'],'Ein getesteter Wiederanlaufplan verbindet Datenverfügbarkeit mit klaren Zuständigkeiten.','Die Dauer von Betriebsunterbrechungen kann sinken und Prioritäten werden im Notfall schneller klar.'],\r\n ['kreativitaet','Bei der Suche nach einer ergonomischen Verbesserung bewertet das Team jede Idee sofort nach Kosten und verwirft viele Vorschläge. Was sollte die Moderation ändern?','Ideenfindung zeitlich von der anschließenden Machbarkeitsbewertung trennen.',['Nur kostengünstige Ideen überhaupt sammeln.','Die Diskussion auf die bisherige Lösung begrenzen.','Die erste umsetzbare Idee ungeprüft als einzig mögliche wählen.'],'Eine getrennte Bewertungsphase erhält zunächst Vielfalt und ermöglicht danach eine realistische Auswahl.','Das Team findet eher mehrere praktikable Optionen für eine spätere Erprobung.'],\r\n ['personalentwicklung','Mehrere Beschäftigte möchten sich auf eine intern frei werdende Stelle bewerben. Wie unterstützt die Personalentwicklung eine faire Vorbereitung?','Anforderungsprofil und erforderliche Kompetenzen transparent machen und Entwicklungsbedarf besprechen.',['Die Stelle nach Betriebszugehörigkeit ohne Anforderungsabgleich vergeben.','Kriterien erst nach den Bewerbungsgesprächen festlegen.','Allen Bewerbenden denselben Kurs unabhängig vom Bedarf zuweisen.'],'Transparente Anforderungen verbinden Auswahl und individuelle Entwicklung.','Der Betrieb kann interne Nachfolge vorbereiten und Entscheidungen nachvollziehbar begründen.'],\r\n ['organisation','Ein Prozess enthält doppelte Dateneingaben in Vertrieb und Arbeitsvorbereitung. Welche Analyse sollte vor einer Systemänderung erfolgen?','Informationsbedarf, Datenverantwortung und Übergabepunkte des Prozesses aufnehmen.',['Eine der Eingaben sofort löschen.','Beide Stellen weiterarbeiten lassen und Fehlerquote ignorieren.','Ein neues System kaufen, bevor Anforderungen geklärt sind.'],'Eine Prozessaufnahme verhindert, dass wichtige Prüf- oder Übergabefunktionen versehentlich entfallen.','Medienbrüche lassen sich reduzieren, ohne notwendige Informationskontrollen zu verlieren.'],\r\n ['analyse','Die Fertigungsauslastung sinkt, weil ein Kunde Aufträge verschiebt. Welche Kennzahlenkombination hilft beim Managementgespräch?','Auftragseingang, Kapazitätsauslastung, Deckungsbeitrag und Liquiditätsvorschau gemeinsam betrachten.',['Nur die Auslastung betrachten und Personal sofort abbauen.','Umsatz der Vorperiode als sichere Prognose verwenden.','Nur den Bankbestand ohne erwartete Zahlungen betrachten.'],'Die Kombination zeigt sowohl wirtschaftliche Tragfähigkeit als auch kurzfristige Zahlungswirkung.','Die Leitung kann Kapazitäts- und Finanzierungsentscheidungen abgestimmt statt isoliert treffen.'],\r\n ['wissensmanagement','Ein neues Qualitätsmerkmal wird von der Konstruktion festgelegt, aber die Fertigung erfährt es erst nach einer Fehlcharge. Welche Wissensschnittstelle fehlt?','Freigegebene Produktänderungen müssen strukturiert an betroffene Prozessrollen übermittelt werden.',['Die Konstruktion soll Änderungen nicht mehr dokumentieren.','Die Fertigung soll jede Zeichnung täglich selbst vergleichen.','Die Fehlcharge als ausreichende Änderungsmitteilung behandeln.'],'Ein definierter Änderungsfluss verbindet technische Entscheidung und operative Umsetzung.','Neue Anforderungen erreichen die Produktion rechtzeitig und Fehlfertigung wird unwahrscheinlicher.']\r\n);\r\nareas.push({id:'hsq-investition-finanzierung-rechnungswesen-controlling',name:'Investition, Finanzierung, betriebliches Rechnungswesen und Controlling',paragraph:2,items:[\r\n ['investitionsplanung','Ein CNC-Bearbeitungszentrum kostet deutlich mehr als eine generalüberholte Maschine, bietet aber höhere Präzision. Welche Investitionsprüfung ist sachgerecht?','Anschaffungs- und Folgekosten, Leistungsfähigkeit, Nutzungsdauer und erwartete Erlöse vergleichen.',['Nur den Anschaffungspreis der beiden Anlagen gegenüberstellen.','Die teurere Anlage wählen, weil Präzision grundsätzlich Umsatz garantiert.','Folgekosten erst nach der Bestellung ermitteln.'],'Die Investition muss nach ihrem gesamten wirtschaftlichen Beitrag und den Kosten beurteilt werden.','Der Betrieb kann Kapitalbedarf und erwarteten Nutzen gemeinsam abwägen.'],\r\n ['investitionsrechnung','Ein Projekt hat eine hohe Anfangsauszahlung und Rückflüsse über mehrere Jahre. Warum ist eine statische Amortisationsrechnung allein begrenzt?','Sie bildet den Zeitwert späterer Zahlungen und Rückflüsse nach der Amortisation nur eingeschränkt ab.',['Sie berücksichtigt immer sämtliche Zahlungsströme mit Abzinsung.','Sie bewertet ausschließlich die Bilanzsumme.','Sie ersetzt automatisch jede Kostenvergleichsrechnung.'],'Die statische Methode liefert eine grobe Rückflussdauer, aber keine vollständige dynamische Vorteilhaftigkeit.','Entscheider ergänzen die Kennzahl um Zahlungszeitpunkte und weitere Wirtschaftlichkeitskriterien.'],\r\n ['investitionsrechnung','Eine neue Maschine reduziert die Bearbeitungszeit, benötigt aber teure Werkzeuge. Welche Betrachtung hilft beim Vergleich mit der Altanlage?','Kosten und Leistungswirkungen je vergleichbarer Produktionseinheit erfassen.',['Nur die Bearbeitungsminute der neuen Anlage betrachten.','Werkzeugkosten als einmalige Investition behandeln, obwohl sie laufend anfallen.','Die Altanlage wegen ihres bereits bezahlten Kaufpreises als kostenfrei einstufen.'],'Ein Einheitenvergleich bezieht relevante laufende Kosten und Produktivität ein.','Die Wahl kann die tatsächlichen Stückkosten statt bloß nominelle Maschinenzeiten verbessern.'],\r\n ['investitionsplanung','Die Geschäftsführung muss zwischen einer Ersatzinvestition und einer Kapazitätserweiterung wählen. Welche Frage trennt die Zwecke?','Ob die Maßnahme bestehende Leistung erhält oder zusätzliche Nachfragekapazität schafft.',['Ob beide Anlagen dieselbe Farbe haben.','Ob die Investition im Organigramm eingezeichnet ist.','Ob die Ersatzanlage automatisch keine Finanzierung braucht.'],'Ersatz- und Erweiterungsinvestitionen haben unterschiedliche Ziele und Vergleichsmaßstäbe.','Bedarf und Finanzplanung werden passend zum Investitionszweck aufgestellt.'],\r\n ['investitionsrechnung','Eine Maschine kann gekauft oder geleast werden. Was muss der Betrieb für einen wirtschaftlichen Vergleich beachten?','Zahlungsreihen, Nutzung, Restwert, Dienstleistungen und Vertragsbedingungen vergleichbar erfassen.',['Kaufpreis mit einer einzelnen Leasingrate vergleichen.','Steuerwirkungen als einzigen Entscheidungsgrund verwenden.','Vertragslaufzeit und Rückgabebedingungen ignorieren.'],'Nur eine vollständige Betrachtung macht unterschiedliche Nutzungs- und Zahlungsmodelle vergleichbar.','Der Betrieb erkennt die Auswirkungen auf Liquidität, Risiko und Nutzungsspielraum.'],\r\n ['finanzplanung','Der Absatzplan sieht Gewinn vor, aber Kunden zahlen erst nach mehreren Wochen. Was zeigt eine Liquiditätsplanung?','Wann Einzahlungen und Auszahlungen anfallen und ob Zwischenfinanzierung nötig wird.',['Ob der Absatzplan rechnerisch einen Gewinn zeigt.','Wie hoch der bilanzielle Maschinenwert ist.','Welche Mitarbeitenden die meisten Stunden leisten.'],'Liquiditätsplanung bildet Zahlungszeitpunkte ab, die vom Erfolg abweichen können.','Zahlungsschwierigkeiten lassen sich vor Fälligkeit erkennen und geordnet adressieren.'],\r\n ['finanzplanung','Ein Unternehmen plant die Anschaffung einer Maschine und mehrere Materialbestellungen. Welche Größe muss es für den Finanzbedarf zusammenführen?','Investitionsauszahlung, laufenden Betriebsmittelbedarf und verfügbare Finanzierung.',['Nur das Eigenkapital am letzten Bilanzstichtag.','Den Jahresumsatz ohne Zahlungszeitpunkte.','Die Abschreibung als tatsächlich verfügbare Einzahlung.'],'Finanzierungsbedarf umfasst die geplante Investition und den Liquiditätsbedarf des Betriebs.','Die Finanzierung wird nicht nur für den Kauf, sondern auch für die Anlaufphase dimensioniert.'],\r\n ['finanzplanung','Die Bank gewährt eine Kreditlinie, deren Limit regelmäßig überprüft wird. Welche Information ist für die Limithöhe relevant?','Planbare Liquiditätsspitzen, Rückführungsfähigkeit und vereinbarte Sicherheiten.',['Der höchste jemals erzielte Monatsumsatz allein.','Die Summe aller Angebote unabhängig von Zuschlagswahrscheinlichkeit.','Nur die Anschaffungskosten der Maschine.'],'Eine Kreditlinie dient kurzfristigem Bedarf; Limit und Rückführung müssen zum tatsächlichen Liquiditätsprofil passen.','Der Betrieb begrenzt Finanzierungskosten und vermeidet eine strukturelle Abhängigkeit vom Kontokorrent.'],\r\n ['finanzierungsarten','Ein Betrieb finanziert eine langlebige Maschine ausschließlich mit täglich kündbarem Kontokorrent. Welches Risiko entsteht?','Laufzeit- und Refinanzierungsrisiko, weil die Finanzierung kürzer als die Nutzung sein kann.',['Das Risiko, dass die Maschine über die Laufzeit keine Abschreibung hat.','Ein Anspruch auf unbegrenzte Kreditverlängerung.','Eine automatische Umwandlung des Kredits in Eigenkapital.'],'Die Fristenkongruenz sollte bei langfristigen Vermögenswerten berücksichtigt werden.','Der Betrieb senkt das Risiko, dass kurzfristige Rückzahlung die Investition oder Liquidität gefährdet.'],\r\n ['finanzierungsarten','Die Eigentümer erwägen eine Eigenkapitalzuführung statt eines weiteren Kredits. Welche Abwägung ist zentral?','Kapitalverfügbarkeit, Einflussrechte, Risiko und langfristige Belastung vergleichen.',['Eigenkapital ohne Auswirkungen auf Eigentum oder Rendite annehmen.','Nur den Nominalzins eines Kredits betrachten.','Eigenkapital als kurzfristig jederzeit rückzahlbare Verbindlichkeit behandeln.'],'Eigen- und Fremdfinanzierung unterscheiden sich bei Kontrolle, Rückzahlung und Risikotragung.','Die Finanzierungsstruktur kann tragfähiger werden, wenn Kapitalgeberinteressen berücksichtigt sind.'],\r\n ['finanzierungsarten','Ein Lieferant bietet ein verlängertes Zahlungsziel, während die Bank einen kurzfristigen Kredit anbietet. Welche Prüfung ist sinnvoll?','Gesamtkosten, Fälligkeiten und Auswirkungen auf Lieferantenbeziehung und Liquiditätsplan vergleichen.',['Das verlängerte Zahlungsziel automatisch als kostenlos ansehen.','Beide Finanzierungsformen ohne Fälligkeit in den Plan eintragen.','Nur nach dem Zinssatz entscheiden und Vertragsbedingungen auslassen.'],'Zahlungsziel und Kredit haben unterschiedliche Kosten- und Beziehungsfolgen.','Der Betrieb kann kurzfristigen Bedarf decken, ohne unbeabsichtigt die Lieferfähigkeit zu beeinträchtigen.'],\r\n ['bilanz','Ein Betrieb erhält ein Darlehen und verwendet es sofort zur Maschinenzahlung. Welche Wirkung hat die Kreditaufnahme im Grundsatz?','Bankmittel und Verbindlichkeiten steigen zunächst; der spätere Kauf tauscht Zahlungsmittel gegen Anlagevermögen.',['Das Eigenkapital steigt unmittelbar um den Darlehensbetrag.','Der Darlehensbetrag wird sofort vollständig als Aufwand gebucht.','Die Maschine erzeugt automatisch einen Umsatzerlös.'],'Finanzierung und Investitionskauf sind getrennte Geschäftsvorfälle und verändern unterschiedliche Bilanzpositionen.','Die Bilanz zeigt Herkunft und Verwendung der Mittel getrennt nachvollziehbar.'],\r\n ['bilanz','Ein Kunde bezahlt eine offene Forderung per Überweisung. Welche unmittelbare Bilanzveränderung ist zu erwarten?','Bankguthaben steigt und Forderungen sinken, der Zahlungseingang ist nicht nochmals Umsatz.',['Bankguthaben und Umsatz steigen erneut um denselben Betrag.','Verbindlichkeiten sinken ohne Zahlungsabgang.','Das Eigenkapital steigt automatisch um den Zahlungseingang.'],'Der Zahlungseingang gleicht eine bereits erfasste Forderung aus und ist keine zweite Leistungserfassung.','Umsatz und Liquidität werden nicht doppelt gezählt.'],\r\n ['erfolgsrechnung','Eine Maschine wird gekauft und im selben Moment vollständig bezahlt. Warum ist der Kaufpreis nicht automatisch sofortiger Aufwand in voller Höhe?','Das Anlagegut wird genutzt; sein Werteverzehr wird grundsätzlich über Nutzungsperioden abgebildet.',['Weil Investitionen nie Kosten verursachen.','Weil die Zahlung die Bilanz nicht verändert.','Weil der Kaufpreis automatisch als Vorrat gilt.'],'Anschaffung und periodischer Werteverzehr sind unterschiedliche Sachverhalte.','Die Ergebnisrechnung verteilt die Nutzungskosten periodengerechter.'],\r\n ['kostenrechnung','Stahlverbrauch kann einem Kundenauftrag mengenmäßig direkt zugeordnet werden. Wie ist er in der Kalkulation grundsätzlich zu behandeln?','Als auftragsbezogene Materialeinzelkosten erfassen.',['Als stets fixe Verwaltungsgemeinkosten buchen.','Als Finanzierungsertrag abziehen.','Nur nach Jahresende pauschal auf alle Aufträge verteilen.'],'Direkte Zurechnung verbessert die verursachungsgerechte Auftragskalkulation.','Angebots- und Nachkalkulation zeigen den Materialbeitrag des einzelnen Auftrags.'],\r\n ['kostenrechnung','Der Maschinenstundensatz steigt, weil weniger produktive Stunden auf die gleiche fixe Kostenbasis verteilt werden. Welche Ursache erklärt den Effekt?','Die geringere Bezugsmenge erhöht die zugerechneten Fixkosten je Maschinenstunde.',['Die Fixkosten sind zwingend im selben Umfang gestiegen.','Die Materialeinzelkosten werden zu Erlösen.','Die Maschine hat durch geringere Nutzung automatisch einen höheren Marktwert.'],'Bei geringerer Beschäftigung verteilen sich unveränderte Fixkosten auf weniger Leistungseinheiten.','Die Leitung erkennt Auslastungseffekte und bewertet Kostensätze nicht als reine Preisänderung.'],\r\n ['kostenrechnung','Ein Auftrag weist einen positiven Deckungsbeitrag aus, deckt aber nicht alle langfristigen Gemeinkosten. Wie sollte die Leitung den Auftrag beurteilen?','Kurzfristige Zusatzentscheidung und langfristige Vollkostendeckung getrennt bewerten.',['Positiven Deckungsbeitrag mit sicherem Gesamtgewinn gleichsetzen.','Alle fixen Kosten als für immer unveränderlich behandeln.','Den Auftrag unabhängig von freien Kapazitäten ablehnen.'],'Der Deckungsbeitrag beantwortet eine andere Frage als die vollständige langfristige Kostendeckung.','Die Annahmeentscheidung kann kurzfristige Kapazitätsnutzung und langfristige Preisstrategie berücksichtigen.'],\r\n ['kostenrechnung','Eine Abteilung verbraucht mehr Hilfsstoffe, als ihr zugeordnet wurde. Welche Kostenstelleninformation hilft, die Abweichung zu lokalisieren?','Verbrauch und Kostenstelle mit Planwerten sowie Leistungsmenge vergleichen.',['Gesamtkosten des Unternehmens ohne Bereichsbezug.','Nur den Umsatz des Vorjahres.','Die Hilfsstoffe dem Kunden mit dem höchsten Auftragswert zuweisen.'],'Kostenstellenrechnung zeigt, wo Kosten anfallen und welche Bezugsgrößen sich verändert haben.','Verantwortliche können gezielte Maßnahmen prüfen, statt pauschal Kosten zu kürzen.'],\r\n ['kalkulation','Ein Angebot wird unter Einbezug von Material und Fertigungszeit kalkuliert, aber Rüstkosten fehlen. Was droht?','Der Angebotspreis unterschätzt die tatsächlichen Auftragskosten und kann die Marge überzeichnen.',['Die Forderung wird bei Annahme zu hoch ausgewiesen.','Die Rüstzeit erhöht automatisch den Deckungsbeitrag.','Der Materialbestand sinkt ohne Materialverbrauch.'],'Vollständige auftragsbezogene Kostenbestandteile sind für eine tragfähige Kalkulation wichtig.','Der Betrieb vermeidet Aufträge, die nur scheinbar wirtschaftlich sind.'],\r\n ['controlling','Die tatsächlichen Materialkosten übersteigen den Plan. Welche erste Controllingreaktion ist angemessen?','Preis- und Mengenabweichung getrennt analysieren und Ursachen belegen.',['Den Plan nachträglich auf Ist setzen.','Die Abweichung ohne Prüfung dem Einkauf anlasten.','Materialkosten im Folgemonat verbuchen.'],'Eine Abweichungsanalyse trennt unterschiedliche Ursachen und verhindert willkürliche Zuschreibungen.','Maßnahmen können am Einkaufspreis, Verbrauch oder Produktmix ansetzen.'],\r\n ['controlling','Eine Absatzprognose wurde trotz negativer Marktindikatoren nicht angepasst. Welche Controllingfunktion wurde vernachlässigt?','Planung mit aktuellen Informationen fortschreiben und Abweichungen früh melden.',['Die Bilanzaufstellung durch den Vertrieb ersetzen.','Abweichungen nur nach Jahresende bewerten.','Prognosen grundsätzlich unverändert halten.'],'Controlling unterstützt Steuerung durch aktuelle Plan-Ist-Informationen und Prognosen.','Kapazitäts- und Liquiditätsentscheidungen reagieren früher auf veränderte Nachfrage.'],\r\n ['kennzahlen','Die Eigenkapitalquote sinkt, während die Bilanzsumme wegen eines Kredits stark wächst. Was muss bei der Interpretation beachtet werden?','Absolute Werte, Finanzierungsvorgang und zeitlichen Verlauf gemeinsam betrachten.',['Eine sinkende Quote beweist allein eine Insolvenz.','Kreditaufnahme als Eigenkapitalzufluss behandeln.','Nur die Quote ohne Bilanzstruktur auswerten.'],'Kennzahlen brauchen Kontext und dürfen nicht als alleinige Diagnose verwendet werden.','Die Geschäftsleitung kann Kapitalstruktur und Schuldentragfähigkeit differenzierter beurteilen.'],\r\n ['steuerung','Eine Kostenstelle liegt über Budget, weil ein ungeplanter Sicherheitsmangel behoben werden musste. Was ist eine sachgerechte Steuerungsreaktion?','Abweichung und Sicherheitsgrund dokumentieren, Prognose aktualisieren und Freigabeweg beachten.',['Die erforderliche Reparatur unterlassen, um den Plan einzuhalten.','Kosten in eine andere Kostenstelle verschieben.','Budgetabweichungen grundsätzlich ignorieren.'],'Budgetsteuerung muss sachliche Notwendigkeit und Verantwortungs-/Freigaberegeln berücksichtigen.','Sicherheitsmaßnahmen werden nicht aus rein formaler Budgettreue verzögert und Kosten bleiben transparent.'],\r\n ['kostenrechnung','Die Geschäftsleitung will wissen, ob die interne Lackierung oder Fremdvergabe wirtschaftlicher ist. Welche Kosten sind für den Vergleich besonders relevant?','Vermeidbare interne Kosten und externe Gesamtkosten einschließlich Qualität und Logistik vergleichen.',['Alle internen Fixkosten als automatisch einsparbar behandeln.','Nur den Fremdpreis ohne Transport oder Prüfaufwand ansehen.','Historische Anschaffungskosten der Lackierkabine allein vergleichen.'],'Entscheidungsrelevant sind Kosten, die sich mit der Alternative ändern, sowie Leistungsfolgen.','Die Make-or-buy-Entscheidung berücksichtigt echte Einsparungen und Servicefolgen.'],\r\n ['investitionsplanung','Ein Unternehmen möchte eine energieeffiziente Maschine kaufen. Welche Zusatzinformation verbessert die Investitionsentscheidung?','Energieeinsparung, Nutzungsprofil, Wartung und erforderliche Investitionskosten abschätzen.',['Mit einer maximalen Werbeangabe rechnen, ohne Betriebsstunden zu prüfen.','Energieverbrauch als einzigen Kostenfaktor behandeln.','Wartungsaufwand aus dem Vergleich ausschließen.'],'Nutzen hängt vom tatsächlichen Einsatz und den gesamten Folgekosten ab.','Die erwartete Einsparung wird an der realen Auslastung statt an Idealbedingungen gemessen.'],\r\n ['finanzplanung','Ein Kunde verschiebt eine große Zahlung, während Löhne und Lieferantenrechnungen fällig werden. Welche kurzfristige Maßnahme ist zuerst nötig?','Aktualisierte Liquiditätsvorschau mit Fälligkeiten und verfügbaren Finanzierungsoptionen erstellen.',['Die offene Forderung als bereits verfügbares Bankguthaben zählen.','Alle Lieferanten automatisch später bezahlen, ohne Vereinbarung.','Den Auftragserfolg als ausreichende Liquiditätsgarantie ansehen.'],'Eine Fälligkeitsübersicht zeigt die zeitliche Lücke und die verfügbaren Handlungsmöglichkeiten.','Der Betrieb kann rechtzeitig kommunizieren und Zahlungsunfähigkeit vermeiden helfen.']\r\n]});\r\nareas[1].items.push(\r\n ['investitionsrechnung','Eine Investition wirkt erst ab 70 Prozent Auslastung vorteilhaft. Welche Prüfung testet ausdrücklich die Belastbarkeit dieser Schwellenannahme?','Nachfrage- und Kapazitätsannahmen auf Plausibilität prüfen und Auslastungsschwellen variieren.',['Die Investition mit Vollauslastung berechnen und Absatzrisiken im laufenden Planungsreview nachhalten.','Die Prognose mit der erwarteten Auslastung rechnen und die 70-Prozent-Schwelle nur als Warnwert im laufenden Betrieb überwachen.','Nur die technische Lebensdauer bewerten.'],'Die Vorteilhaftigkeit hängt von einer kritischen Annahme ab, die mit realistischen Szenarien geprüft werden muss.','Das Unternehmen kann erkennen, wie empfindlich die Investition auf schwächere Auslastung reagiert.'],\r\n ['investitionsrechnung','Zwei Maschinen haben gleiche jährliche Kosten, aber unterschiedliche Produktionsmengen. Welche Vergleichsgröße ist zweckmäßig?','Kosten je nutzbarer Leistungseinheit bei gleicher Qualitätsanforderung berechnen.',['Gesamtkosten ohne Mengeneinheit vergleichen.','Nur die maximale Herstellerleistung verwenden.','Die Maschine mit höherem Anschaffungspreis wählen.'],'Ein Kostenvergleich je Leistungseinheit macht unterschiedliche Mengen vergleichbar.','Die Kapazitätsentscheidung berücksichtigt die tatsächlich benötigte Leistung und Qualität.'],\r\n ['investitionsplanung','Ein Betrieb plant eine Erweiterung, doch die vorgelagerte Stromversorgung reicht möglicherweise nicht. Was muss in die Investitionsplanung einbezogen werden?','Ergänzende Infrastruktur, Umsetzungskosten und zeitliche Abhängigkeiten erfassen.',['Nur den Maschinenpreis in den Finanzierungsantrag aufnehmen.','Versorgungsengpässe nach der Lieferung behandeln.','Die Infrastruktur als kostenlose Voraussetzung annehmen.'],'Ergänzende Maßnahmen können notwendige Bestandteile und Kosten der Investition sein.','Verzögerungen und nicht eingeplante Zusatzfinanzierung werden eher vermieden.'],\r\n ['investitionsrechnung','Ein Projekt erzielt positive Jahresüberschüsse, aber benötigt hohe Vorleistungen lange vor dem Zahlungseingang. Welche ergänzende Rechnung ist entscheidend?','Zahlungsströme nach Zeitpunkt planen und dynamisch auf ihre Vorteilhaftigkeit untersuchen.',['Nur die erwartete Gewinnsumme addieren.','Abschreibungen als Einzahlungen behandeln.','Kundenzahlungen ohne Fälligkeit ansetzen.'],'Erfolg und Liquiditätsverlauf sind verschieden; zeitliche Zahlungsströme beeinflussen den Kapitalwert.','Die Leitung erkennt sowohl Rendite als auch zwischenzeitliche Finanzierungslücken.'],\r\n ['finanzplanung','Die monatlichen Einzahlungen schwanken saisonal stark. Welcher Planungsansatz passt besser als ein gleichbleibender Monatsdurchschnitt?','Rollierende Liquiditätsplanung mit erwarteten Fälligkeiten und Saisonverlauf erstellen.',['Den Jahresumsatz gleichmäßig auf alle Monate verteilen.','Nur den aktuellen Kassenbestand betrachten.','Schwache Monate aus dem Plan entfernen.'],'Ein rollierender Plan bildet erwartete Zahlungszeitpunkte und Änderungen ab.','Finanzierungsbedarf kann vor saisonalen Engpässen erkannt und angepasst werden.'],\r\n ['finanzplanung','Ein Unternehmen gewährt Kunden längere Zahlungsziele, um wettbewerbsfähig zu bleiben. Welche Folge ist in der Finanzplanung zu berücksichtigen?','Zusätzlicher Forderungsbestand und späterer Liquiditätszufluss einplanen.',['Das Zahlungsziel als sofortigen Zahlungseingang behandeln.','Den Preisnachlass gleich null setzen, unabhängig von Finanzierungskosten.','Die Forderung aus der Bilanzplanung entfernen.'],'Längere Zahlungsziele binden Kapital bis zum Zahlungseingang.','Konditionen können unter Berücksichtigung von Absatzwirkung und Finanzierungskosten bewertet werden.'],\r\n ['finanzierungsarten','Eine Maschine soll durch ein langfristiges Darlehen finanziert werden. Die Bank verlangt Sicherheiten. Was sollte die Geschäftsführung vor Zusage klären?','Sicherheitenumfang, Verwertungsfolgen, Laufzeit und gesamte Belastung prüfen.',['Die Sicherheiten als kostenfreie Formalität behandeln.','Dem Kreditgeber sämtliche Vermögenswerte ohne Dokumentation anbieten.','Nur die monatliche Rate betrachten.'],'Kreditkonditionen umfassen mehr als die Rate; Sicherheiten binden Vermögen und tragen Verwertungsrisiken.','Der Betrieb kann Tragfähigkeit und mögliche Folgen eines Zahlungsausfalls abwägen.'],\r\n ['finanzierungsarten','Der Betrieb erzielt einen Gewinn und möchte ihn im Unternehmen belassen statt auszuschütten. Welche Finanzierungsform liegt nahe?','Selbstfinanzierung durch Einbehaltung von erwirtschafteten Mitteln prüfen.',['Fremdfinanzierung aus einer Bankeinlage.','Außenfinanzierung durch Lieferantenrechnung.','Abschreibung als automatisch verfügbare Finanzierung gleichsetzen.'],'Einbehaltene Gewinne können die Innenfinanzierung stärken, sofern ausreichende Zahlungsmittel vorhanden sind.','Eigenmittelbasis kann wachsen, ohne dass ein neues Darlehen aufgenommen wird.'],\r\n ['finanzierungsarten','Ein kurzfristiger Auftrag erfordert zusätzliche Materialien; der Kunde zahlt nach Abnahme. Welche Finanzierung passt zur vorübergehenden Vorfinanzierung?','Kurzfristigen Betriebsmittelbedarf und Rückflusszeitpunkt mit geeigneten Kredit- oder Lieferantenoptionen abgleichen.',['Eine langfristige Maschinenfinanzierung für jeden Materialeinkauf abschließen.','Die Rechnung als Eigenkapital verbuchen.','Fälligkeiten ignorieren und auf einen Gewinn vertrauen.'],'Die Finanzierung sollte Zweck, Dauer und Rückfluss des Bedarfs berücksichtigen.','Die Kapitalbindung des Auftrags kann überbrückt werden, ohne die Investitionsfinanzierung unnötig zu belasten.'],\r\n ['bilanz','Der Eigentümer zahlt zusätzliches Kapital auf das Firmenkonto ein. Welche Bilanzwirkung ist grundsätzlich naheliegend?','Bankguthaben und Eigenkapital steigen, sofern es sich tatsächlich um eine Einlage handelt.',['Bankguthaben und Lieferantenverbindlichkeiten steigen zwingend gemeinsam.','Der Betrag wird sofort als Umsatzerlös ausgewiesen.','Das Eigenkapital sinkt um den Einzahlungsbetrag.'],'Eine Einlage erhöht die Zahlungsmittel und die Eigenkapitalposition, ohne Umsatz aus Leistungserbringung zu sein.','Die Finanzierung wird als Eigentümerbeitrag transparent von operativen Erträgen getrennt.'],\r\n ['bilanz','Ein Betrieb erhält Material auf Rechnung und nutzt es später für einen Auftrag. Was entsteht beim Wareneingang zunächst?','Vorräte beziehungsweise Materialbestand und eine Verbindlichkeit gegenüber dem Lieferanten.',['Sofort ein Kundenerlös.','Ausschließlich ein Zahlungsmittelabfluss.','Eine Erhöhung des Eigenkapitals.'],'Lieferung und spätere Zahlung sind getrennte Vorgänge; Materialbestand und Schuld entstehen zunächst.','Bestände und offene Verpflichtungen werden im Abschluss nicht verwechselt.'],\r\n ['erfolgsrechnung','Ein Kunde reklamiert eine bereits fakturierte Leistung und der Betrieb gewährt eine Preisgutschrift. Welche Ergebniswirkung ist zu untersuchen?','Die Erlösminderung und ihre Zuordnung zur betroffenen Periode berücksichtigen.',['Die Gutschrift als Materialzugang erfassen.','Den Rechnungsbetrag unverändert als endgültigen Erlös behandeln.','Die Gutschrift als Eigenkapitaleinlage verbuchen.'],'Eine nachträgliche Preisänderung beeinflusst den Erlös und muss nachvollziehbar erfasst werden.','Auftragsergebnis und Kundenforderung spiegeln die vereinbarte Korrektur wider.'],\r\n ['erfolgsrechnung','Die Maschine fällt eine Woche aus. Der Betrieb will den Liefertermin durch externe Fertigung sichern. Welche zusätzliche Kostenposition sollte er in den Vergleich aufnehmen?','Angebotspreis externer Fertigung mit entfallenden internen variablen Kosten und zusätzlichem Koordinationsaufwand vergleichen.',['Nur die bilanzielle Abschreibung als vollständige Ausfallwirkung ansehen.','Den gesamten geplanten Wochenumsatz als Ausfall ansetzen und mögliche Nachproduktion im Folgemonat als separates Zusatzgeschäft behandeln.','Die Stillstandszeit ohne Bezug zu Aufträgen ignorieren.'],'Bei Fremdvergabe sind deren Angebotspreis, vermeidbare interne variable Kosten und zusätzlicher Koordinationsaufwand zu vergleichen.','Die Instandhaltungsentscheidung berücksichtigt den gesamten wirtschaftlichen Schaden.'],\r\n ['kostenrechnung','Ein Produkt wird in kleinen Losen hergestellt und verursacht viele Rüstvorgänge. Welcher Zuschlag könnte die verursachungsgerechtere Kalkulation unterstützen?','Rüstkosten nach Anzahl oder Aufwand der Rüstvorgänge auf Produkte verteilen.',['Rüstkosten allein nach Materialgewicht verteilen.','Alle Rüstkosten dem größten Kunden zurechnen.','Rüstkosten aus der Kalkulation entfernen.'],'Ein geeigneter Kostentreiber bildet den Zusammenhang zwischen Rüstaufwand und Losstruktur besser ab.','Kleinserien werden realistischer kalkuliert und nicht durch grobe Verteilung verzerrt.'],\r\n ['kostenrechnung','Die Fertigung verbraucht mehr Stahl als die Stückliste vorsieht. Welche Betrachtung trennt Preis- von Verbrauchseffekt?','Sollmenge und Istmenge sowie Planpreis und Istpreis getrennt vergleichen.',['Nur den Gesamtbetrag der Materialrechnung ansehen.','Den Mehrverbrauch mit dem höheren Einkaufspreis erklären, ohne Mengen zu prüfen.','Die Stückliste nachträglich an den Istverbrauch anpassen.'],'Eine getrennte Mengen- und Preisabweichung zeigt, ob Ursache im Prozess oder Einkauf liegt.','Korrektur kann gezielt an Beschaffung oder Fertigung ansetzen.'],\r\n ['kostenrechnung','Ein Gemeinkostenzuschlag basiert auf einer einzigen Kostenbasis, obwohl Produkte sehr unterschiedliche Prüfaufwände haben. Welche Verbesserung ist naheliegend?','Geeignete verursachungsnahe Bezugsgrößen oder differenzierte Kostentreiber prüfen.',['Den Zuschlag pauschal erhöhen.','Prüfaufwand vollständig als Einzelkosten jedes Produkts mit gleichem Wert erfassen.','Die Kalkulation ohne Gemeinkosten fortführen.'],'Eine passende Bezugsgröße verbessert die Zurechnung heterogener Gemeinkosten.','Produktkosten und Preisentscheidungen werden weniger durch Quersubventionierung verzerrt.'],\r\n ['kalkulation','Ein Kunde verlangt eine Sonderverpackung, die im Standardangebot nicht enthalten war. Was ist vor Preisbestätigung zu kalkulieren?','Zusätzliche Material-, Arbeits- und gegebenenfalls Logistikkosten der Sonderleistung erfassen.',['Die Verpackung als kostenlose Marketingmaßnahme behandeln.','Den Standardpreis unverändert lassen, ohne Leistungsumfang zu prüfen.','Die Mehrkosten nachträglich ohne Vereinbarung berechnen.'],'Eine Leistungsänderung kann die Kosten verändern und sollte vor einer verbindlichen Zusage bewertet werden.','Der Betrieb schützt Auftragsmarge und schafft klare Kundenerwartungen.'],\r\n ['controlling','Ein Projekt unterschreitet das Investitionsbudget, verzögert sich aber stark. Welche Kennzahlensicht ist für die Steuerung nötig?','Kostenstand zusammen mit Terminfortschritt und erreichtem Leistungsumfang bewerten.',['Niedrige Ausgaben als sicheren Projekterfolg werten.','Verzögerungen nicht betrachten, solange Budget frei ist.','Nur den Prozentsatz der ausgegebenen Mittel melden.'],'Ein Projekt kann kostengünstig erscheinen, weil Arbeit noch nicht erbracht wurde.','Die Leitung kann Termin- und Leistungsrisiken trotz unterschrittenem Budget früh erkennen.'],\r\n ['controlling','Eine Prognose wird jeden Monat knapp verfehlt und nachträglich an den Istwert angepasst. Welche Steuerungsverbesserung ist sinnvoll?','Prognoseannahmen und Abweichungsgründe nachvollziehbar festhalten und unabhängig aktualisieren.',['Die Prognose immer unverändert lassen.','Jede Abweichung als zufälliges Ereignis deklarieren.','Prognose und Istwert gleichsetzen, um Abweichungen zu vermeiden.'],'Eine belastbare Prognose soll erwartete Entwicklung zeigen, nicht rückwirkend den Istwert kopieren.','Entscheidungen basieren auf einer ehrlichen Einschätzung künftiger Risiken.'],\r\n ['kennzahlen','Der Umsatz je Beschäftigtem steigt, gleichzeitig wird ein größerer Teil der Fertigung ausgelagert. Was ist bei der Kennzahl zu beachten?','Veränderten Leistungsumfang und Fremdleistungsanteil in die Interpretation einbeziehen.',['Produktivität allein aus der Quote als verbessert bezeichnen.','Fremdleistungen als eigene Beschäftigtenstunden zählen.','Die Kennzahl ohne Periodenvergleich beurteilen.'],'Eine Kennzahl verändert sich auch durch Organisationsgrenzen und Fremdbezug.','Die Leitung unterscheidet echte Produktivitätssteigerung von einer Verschiebung des Leistungsumfangs.'],\r\n ['steuerung','Ein Absatzbereich überschreitet sein Werbebudget, weil eine Kampagne unerwartet erfolgreich läuft. Was sollte Controlling tun?','Zusatzaufwand, erwarteten Nutzen und erforderliche Freigabe gegen die aktualisierte Planung abwägen.',['Die Kampagne sofort stoppen, ohne Wirkung zu prüfen.','Zusatzkosten außerhalb der Buchhaltung führen.','Mehrbudget automatisch freigeben, nur weil die Nachfrage steigt.'],'Eine positive Entwicklung kann zusätzliche Ausgaben rechtfertigen, benötigt aber transparente Steuerung.','Das Unternehmen kann Wachstumschancen nutzen und dennoch Budgetdisziplin wahren.'],\r\n ['investitionsplanung','Ein Unternehmen erwägt den Kauf eines gebrauchten Gebäudes. Welche Entscheidungsvorbereitung sollte neben dem Kaufpreis erfolgen?','Zustand, notwendige Modernisierung, Standortfolgen und Finanzierung prüfen.',['Den Kaufpreis als vollständigen Gesamtaufwand ansehen.','Finanzierung erst nach bindender Unterzeichnung verhandeln.','Miet- und Kaufoptionen ohne Nutzungshorizont vergleichen.'],'Gebäudekauf kann zusätzliche Instandsetzungs-, Umzugs- und Finanzierungslasten mit sich bringen.','Der Betrieb vermeidet eine Investition, deren tatsächlicher Kapitalbedarf unterschätzt wurde.'],\r\n ['finanzplanung','Eine Forderung ist überfällig, aber der Kunde bestreitet einen Teil der Leistung. Wie sollte die Liquiditätsprognose damit umgehen?','Zahlungseingang risikogewichtet und zeitlich vorsichtig planen, Klärung separat verfolgen.',['Den vollen Betrag als sichere Einzahlung zum ursprünglichen Termin zählen.','Die Forderung endgültig streichen, bevor sie geprüft wurde.','Die bestrittene Forderung als Bankguthaben behandeln.'],'Eine unsichere Forderung darf nicht wie verfügbares Zahlungsmittel behandelt werden.','Die Prognose unterschätzt kurzfristigen Finanzierungsbedarf seltener.'],\r\n ['finanzierungsarten','Die Hausbank bietet einen Festzinskredit und einen variabel verzinsten Kredit an. Welche Überlegung ist wesentlich?','Zinsänderungsrisiko, Planungssicherheit, Laufzeit und mögliche Gesamtkosten abwägen.',['Variablen Zins als dauerhaft niedriger garantieren.','Nur den ersten Monatszins vergleichen.','Festzins automatisch als kostenfrei ansehen.'],'Die Kreditform verteilt Zinsänderungsrisiko und Planungssicherheit unterschiedlich.','Die Finanzierung kann passend zur Risikotragfähigkeit und Planbarkeit gewählt werden.'],\r\n ['kostenrechnung','Ein Produktionsauftrag nutzt eine knappe CNC-Stunde, die auch für einen anderen Auftrag eingesetzt werden könnte. Welche Zusatzgröße ist für die Annahmeentscheidung relevant?','Deckungsbeitrag je Engpasseinheit und entgangene Alternative vergleichen.',['Nur den absoluten Umsatz des Auftrags betrachten.','Die Engpasszeit als kostenfrei behandeln.','Den höchsten Stückdeckungsbeitrag ohne Zeitbezug wählen.'],'Bei knapper Kapazität entscheidet die relative Wertschöpfung je Engpasseinheit.','Die begrenzte Maschinenzeit wird eher Aufträgen mit höherem Ergebnisbeitrag zugeordnet.']\r\n);\r\nareas.push({id:'hsq-logistik',name:'Logistik',paragraph:3,items:[\r\n ['beschaffungsbedarf','Die Fertigung plant drei Aufträge, aber der Materialbedarf ist nur für zwei vollständig ermittelt. Was sollte der Einkauf vor Bestellung klären?','Stücklisten und Fertigungspläne auf Vollständigkeit prüfen und offenen Bedarf bestätigen lassen.',['Den Verbrauch des fehlenden Auftrags aus dem Vorjahresumsatz schätzen.','Für alle Werkstoffe pauschal dieselbe Menge bestellen.','Erst während der Fertigung feststellen, welche Teile fehlen.'],'Eine belastbare Bedarfsermittlung geht der Bestellung voraus und reduziert Fehl- oder Überbestände.','Material wird gezielter beschafft und Produktionsunterbrechungen werden unwahrscheinlicher.'],\r\n ['lieferantenauswahl','Ein Lieferant bietet den niedrigsten Preis, hatte aber zuletzt häufig verspätet geliefert. Wie sollte die Auswahl erfolgen?','Preis, Qualität, Zuverlässigkeit und Lieferzeit anhand gewichteter Kriterien bewerten.',['Den niedrigsten Preis automatisch annehmen.','Verspätungen bei der Entscheidung nicht berücksichtigen.','Nur die Entfernung zum Werk vergleichen.'],'Lieferzuverlässigkeit beeinflusst Bestand, Produktion und Kundentermine und muss in die Entscheidung einfließen.','Die Beschaffung kann Gesamtkosten und Versorgungssicherheit gemeinsam abwägen.'],\r\n ['beschaffungsstrategie','Ein Spezialbauteil ist nur bei einem Anbieter erhältlich und hat lange Lieferzeit. Welche Beschaffungsstrategie reduziert das Risiko?','Versorgungsrisiko, Sicherheitsbestand, Alternativqualifikatio
