name: ChatGPT Code Review for WFWSimulation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  chatgpt-review:
    name: Run ChatGPT Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Collect PR diff as a file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_REF="refs/remotes/origin/pull/$PR_NUMBER"
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:$PR_REF"
          ACTUAL_HEAD_SHA="$(git rev-parse "$PR_REF")"
          test "$ACTUAL_HEAD_SHA" = "$PR_HEAD_SHA"
          git diff "$BASE_SHA...$PR_REF" -- > "$RUNNER_TEMP/pr.diff"

      - name: Build JSON request from diff file
        run: node .github/scripts/chatgpt-review.mjs create-request "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/request.json"

      - name: Ask ChatGPT for review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            --data-binary "@$RUNNER_TEMP/request.json" \
            > "$RUNNER_TEMP/response.json"
          node .github/scripts/chatgpt-review.mjs extract-response "$RUNNER_TEMP/response.json" "$RUNNER_TEMP/review.md"

      - name: Post or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/chatgpt-review.mjs post-comment "$RUNNER_TEMP/review.md"
